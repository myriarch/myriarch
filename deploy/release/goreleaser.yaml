# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
#
# Release matrix of myriarch (authoritative for releases; "make release" builds all binaries for all five platforms as
# a check):
#
#   myriarchd        linux amd64/arm64, darwin arm64            (with the embedded web UI, -tags embedui; the archive also holds
#                                                               examples/quickstart for the server image)
#   myriarch-updater linux amd64/arm64, windows amd64/arm64
#   myrctl      linux, darwin, windows x amd64/arm64
#   myriarch-sim     linux amd64/arm64, darwin arm64
#
# License files: every tar.gz and zip archive holds LICENSE and THIRD_PARTY_NOTICES at its root (Apache-2.0 and the licenses of
# the bundled components require the texts to travel with the binaries). THIRD_PARTY_NOTICES is generated by
# scripts/gen-third-party-notices.sh. The bare binaries of the "binary" format have no room for files: the bare myriarch-updater
# carries both texts inside (`myriarch-updater licenses [--third-party]`), and myriarchd serves them under /licenses (a different
# program, which the operator of an updater host may not run). LICENSE and THIRD_PARTY_NOTICES are also release assets of their own
# and are listed in checksums.txt (checksum.extra_files; goreleaser does not copy them into dist/, the release workflow uploads
# them from the repository root). Every archive names its files explicitly, because an explicit list replaces goreleaser's default.
#
# Reproducible: timestamps and BuildDate come from the commit ({{ .CommitDate }}), not from the clock, and the Windows version
# resources are deterministic and git-ignored (cmd/<binary>/rsrc_windows_*.syso, see deploy/release/windows-signed.sh); a second
# build of a commit with the same Go toolchain and goreleaser yields the same binaries and archives. The SBOMs differ between two
# runs in syft's documentNamespace and creation time, and checksums.txt with them (deploy/release/README.md).
#
# No signing key: goreleaser signs nothing here (no `signs:`). Releases are signed keyless by the release workflow (ADR-0023), and
# Authenticode for the Windows files comes through the signing hook in stage apply (deploy/release/windows-signed.sh,
# ci/release/windows-sign-hook.sh). Publishing is not configured here either: `release:` below is disabled.
#
# Invocation from the repository root: `make release-snapshot` (ci/build-release.sh snapshot, local test only) or
# `make release-rehearsal` (ci/release/rehearsal.sh, the full path in a snapshot). MYRIARCH_WINDOWS_STAGE is required
# (off, collect or apply; deploy/release/README.md). The release workflow runs
#   goreleaser build --clean --id myriarch-updater --id myrctl -f deploy/release/goreleaser.yaml     (stage collect)
#   goreleaser release --clean --skip=publish -f deploy/release/goreleaser.yaml                      (stage apply)
#
# Prerequisites: Go, the built web UI (internal/webui/dist, make web-build), goreleaser, syft, go-winres and yq from
# ci/install-tools.sh, python3, and osslsigncode (ci/install-tools.sh osslsigncode) for stage apply with signed files.
version: 2
project_name: myriarch

before:
  hooks:
    # Windows version resources (VERSIONINFO, git-ignored cmd/<binary>/rsrc_windows_<arch>.syso) and the Windows scripts of the
    # archives (.cache/release/windows/archive/windows/); validates MYRIARCH_WINDOWS_STAGE (deploy/release/README.md)
    - bash deploy/release/windows-signed.sh prepare "{{ .Version }}" "{{ .IsSnapshot }}"

env:
  - CGO_ENABLED=0

builds:
  - id: myriarchd
    main: ./cmd/myriarchd
    binary: myriarchd
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags: [-trimpath]
    # Release builds deliberately omit the devpg build tag: the embedded PostgreSQL (and its dependencies) stays out of the
    # release binaries; "myriarchd dev" needs --dsn there (docs/development.md, checked by ci/check-release-deps.sh).
    tags: [embedui]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ignore:
      - {goos: darwin, goarch: amd64}
    hooks:
      pre:
        # the release build never runs Node: the UI comes prebuilt (make web-build, or the ui job of the release workflow)
        - cmd: "bash -c 'test -f internal/webui/dist/index.html || { echo \"internal/webui/dist/index.html is missing: build the web UI first (make web-build)\" >&2; exit 1; }'"
    ldflags: &ldflags
      - -s -w
      - -X github.com/myriarch/myriarch/internal/version.Version={{ .Version }}
      - -X github.com/myriarch/myriarch/internal/version.Commit={{ .Commit }}
      - -X github.com/myriarch/myriarch/internal/version.BuildDate={{ .CommitDate }}

  - id: myriarch-updater
    main: ./cmd/myriarch-updater
    binary: myriarch-updater
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags: [-trimpath]
    goos: [linux, windows]
    goarch: [amd64, arm64]
    ldflags: *ldflags
    hooks:
      post:
        # Windows: the stage hook (collect / accept the signed file); other platforms: no-op
        - cmd: bash deploy/release/windows-signed.sh build myriarch-updater "{{ .Path }}" "{{ .Os }}" "{{ .Arch }}" "{{ .IsSnapshot }}" "{{ .Version }}"

  - id: myrctl
    main: ./cmd/myrctl
    binary: myrctl
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags: [-trimpath]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags: *ldflags
    hooks:
      post:
        - cmd: bash deploy/release/windows-signed.sh build myrctl "{{ .Path }}" "{{ .Os }}" "{{ .Arch }}" "{{ .IsSnapshot }}" "{{ .Version }}"

  - id: myriarch-sim
    main: ./cmd/myriarch-sim
    binary: myriarch-sim
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags: [-trimpath]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ignore:
      - {goos: darwin, goarch: amd64}
    ldflags: *ldflags

archives:
  - id: myriarchd
    ids: [myriarchd]
    formats: [tar.gz]
    name_template: "myriarchd_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds_info:
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info:
          mtime: "{{ .CommitDate }}"
      - src: THIRD_PARTY_NOTICES
        info:
          mtime: "{{ .CommitDate }}"
      - src: README.md
        info:
          mtime: "{{ .CommitDate }}"
      - src: deploy/helm/**/*
        info:
          mtime: "{{ .CommitDate }}"
      - src: deploy/compose/*
        info:
          mtime: "{{ .CommitDate }}"
      - src: deploy/docker/*
        info:
          mtime: "{{ .CommitDate }}"
      # the example GitOps repository: the published server image (scripts/build-image-crane.sh, IMAGE_SOURCE=dist) takes it
      # from this archive, so everything in the image is covered by checksums.txt
      - src: examples/quickstart
        info:
          mtime: "{{ .CommitDate }}"

  # myriarch-updater including install scripts, templates and service files (self-contained package for hosts)
  - id: myriarch-updater
    ids: [myriarch-updater]
    formats: [tar.gz]
    format_overrides:
      - {goos: windows, formats: [zip]}
    name_template: "myriarch-updater_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds_info:
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info:
          mtime: "{{ .CommitDate }}"
      - src: THIRD_PARTY_NOTICES
        info:
          mtime: "{{ .CommitDate }}"
      - src: deploy/scripts/install-linux.sh
        dst: deploy/scripts
        strip_parent: true
        info:
          mtime: "{{ .CommitDate }}"
      - src: deploy/supervisor/**/*
        dst: deploy/supervisor
        info:
          mtime: "{{ .CommitDate }}"
      - src: deploy/systemd/*
        dst: deploy/systemd
        strip_parent: true
        info:
          mtime: "{{ .CommitDate }}"
      - src: deploy/updater/**/*
        dst: deploy/updater
        info:
          mtime: "{{ .CommitDate }}"
      - src: deploy/windows/README.md
        dst: deploy/windows
        strip_parent: true
        info:
          mtime: "{{ .CommitDate }}"
      # Windows scripts: only in the Windows archives (ADR-0034), from the staging directory that the before hook fills (the
      # repository files, or in stage apply the accepted signed copies). For other systems the glob matches nothing (goreleaser
      # logs "no files matched").
      - src: ".cache/release/windows/archive/{{ .Os }}/scripts/*"
        dst: deploy/scripts
        strip_parent: true
        info:
          mtime: "{{ .CommitDate }}"
      - src: ".cache/release/windows/archive/{{ .Os }}/windows/*"
        dst: deploy/windows
        strip_parent: true
        info:
          mtime: "{{ .CommitDate }}"

  # bare binaries: target of install-linux.sh --updater-url / install-windows.ps1 -UpdaterUrl
  - id: myriarch-updater-binary
    ids: [myriarch-updater]
    formats: [binary]
    name_template: "myriarch-updater_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds_info:
      mtime: "{{ .CommitDate }}"

  - id: myrctl
    ids: [myrctl]
    formats: [tar.gz]
    format_overrides:
      - {goos: windows, formats: [zip]}
    name_template: "myrctl_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds_info:
      mtime: "{{ .CommitDate }}"
    # explicit list: it replaces the goreleaser default (LICEN[CS]E*, README*, CHANGELOG*), so README and CHANGELOG are named
    files:
      - src: LICENSE
        info:
          mtime: "{{ .CommitDate }}"
      - src: THIRD_PARTY_NOTICES
        info:
          mtime: "{{ .CommitDate }}"
      - src: README.md
        info:
          mtime: "{{ .CommitDate }}"
      - src: CHANGELOG.md
        info:
          mtime: "{{ .CommitDate }}"

  - id: myriarch-sim
    ids: [myriarch-sim]
    formats: [tar.gz]
    name_template: "myriarch-sim_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds_info:
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info:
          mtime: "{{ .CommitDate }}"
      - src: THIRD_PARTY_NOTICES
        info:
          mtime: "{{ .CommitDate }}"
      - src: examples/sim/*
        info:
          mtime: "{{ .CommitDate }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256
  # LICENSE and THIRD_PARTY_NOTICES are release assets of their own (uploaded by the release workflow from the repository root)
  extra_files:
    - glob: ./LICENSE
    - glob: ./THIRD_PARTY_NOTICES

sboms:
  # One SPDX JSON SBOM per archive (<archive>.sbom.json) and one for the web UI (the production dependencies of its lockfile).
  # deploy/release/sbom.sh runs the pinned syft with deploy/release/syft.yaml: no network, no enrichment. goreleaser runs it in dist/.
  - id: archives
    artifacts: archive
    documents: ["{{ .ArtifactName }}.sbom.json"]
    cmd: bash
    args: ["../deploy/release/sbom.sh", "archive", "$artifact", "$document"]
  - id: webui
    artifacts: any
    documents: ["myriarch-webui_{{ .Version }}.sbom.json"]
    cmd: bash
    args: ["../deploy/release/sbom.sh", "webui", "{{ .Version }}", "$document"]

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

# The release notes come from the CHANGELOG through the release workflow, not from the commit log.
changelog:
  disable: true

# No release publishing here: the release workflow publishes with gh from separate jobs. `goreleaser release` therefore runs
# with --skip=publish.
release:
  disable: true
