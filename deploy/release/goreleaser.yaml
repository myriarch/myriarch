# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
#
# Release matrix of myriarch (authoritative for releases; "make release" builds all binaries for all five platforms as
# a check):
#
#   myriarchd        linux amd64/arm64, darwin arm64            (with the embedded web UI, -tags embedui; the archive also holds
#                                                               examples/quickstart for the server image)
#   myriarch-updater linux amd64/arm64, windows amd64/arm64
#   myrctl      linux, darwin, windows x amd64/arm64
#   myriarch-sim     linux amd64/arm64, darwin arm64
#
# License files: every tar.gz and zip archive holds LICENSE and THIRD_PARTY_NOTICES at its root (Apache-2.0 and the licenses of
# the bundled components require the texts to travel with the binaries). THIRD_PARTY_NOTICES is generated by
# scripts/gen-third-party-notices.sh. The bare binaries of the "binary" format have no room for files: the bare myriarch-updater
# carries both texts inside (`myriarch-updater licenses [--third-party]`), and myriarchd serves them under /licenses (a different
# program, which the operator of an updater host may not run). Once release publishing exists, LICENSE and
# THIRD_PARTY_NOTICES are published as standalone release assets as well. Every archive names its files explicitly, because an
# explicit list replaces goreleaser's default.
#
# Reproducible: timestamps and BuildDate come from the commit ({{ .CommitDate }}), not from the clock; a second run on the
# same tag yields the same binaries and archives (exception: Authenticode signatures and timestamps of the Windows
# binaries; only the state BEFORE signing is reproducible there).
#
# Invocation from the repository root (ci/build-release.sh wraps it):
#   goreleaser release --clean --skip=publish -f deploy/release/goreleaser.yaml   # tagged commit: build + sign, nothing published
#   goreleaser release --snapshot --clean --skip=sign,publish -f deploy/release/goreleaser.yaml   # local test only (snapshot), never for releases
#
# Publishing is not configured here: the release page and keyless signing come with the GitHub release workflow
# (ADR-0023). `release:` below is disabled until then.
#
# Prerequisites: Go, Node.js (.node-version) + pnpm (UI build, only if internal/webui/dist is missing), cosign v3 (signing is mandatory
# for releases; --skip=sign is meant for snapshots only) and, for the Windows binaries, osslsigncode + an Authenticode
# certificate (deploy/release/authenticode.sh aborts release builds without a certificate).
# Signing keys: deploy/release/README.md.
version: 2
project_name: myriarch

before:
  hooks:
    # UI into internal/webui/dist (for -tags embedui). A snapshot may reuse an existing build; ci/build-release.sh removes it
    # before a release, so that the UI of the release is built from the tagged commit.
    - sh -c 'test -f internal/webui/dist/index.html || (cd web && pnpm install --frozen-lockfile && pnpm build)'

env:
  - CGO_ENABLED=0

builds:
  - id: myriarchd
    main: ./cmd/myriarchd
    binary: myriarchd
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags: [-trimpath]
    # Release builds deliberately omit the devpg build tag: the embedded PostgreSQL (and its dependencies) stays out of the
    # release binaries; "myriarchd dev" needs --dsn there (docs/development.md, checked by ci/check-release-deps.sh).
    tags: [embedui]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ignore:
      - {goos: darwin, goarch: amd64}
    ldflags: &ldflags
      - -s -w
      - -X github.com/myriarch/myriarch/internal/version.Version={{ .Version }}
      - -X github.com/myriarch/myriarch/internal/version.Commit={{ .Commit }}
      - -X github.com/myriarch/myriarch/internal/version.BuildDate={{ .CommitDate }}

  - id: myriarch-updater
    main: ./cmd/myriarch-updater
    binary: myriarch-updater
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags: [-trimpath]
    goos: [linux, windows]
    goarch: [amd64, arm64]
    ldflags: *ldflags
    hooks:
      post:
        # Authenticode for the Windows binaries (they run as SYSTEM); other platforms: no-op
        - cmd: sh deploy/release/authenticode.sh "{{ .Path }}" "{{ .IsSnapshot }}"

  - id: myrctl
    main: ./cmd/myrctl
    binary: myrctl
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags: [-trimpath]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags: *ldflags

  - id: myriarch-sim
    main: ./cmd/myriarch-sim
    binary: myriarch-sim
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags: [-trimpath]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ignore:
      - {goos: darwin, goarch: amd64}
    ldflags: *ldflags

archives:
  - id: myriarchd
    ids: [myriarchd]
    formats: [tar.gz]
    name_template: "myriarchd_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds_info:
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info:
          mtime: "{{ .CommitDate }}"
      - src: THIRD_PARTY_NOTICES
        info:
          mtime: "{{ .CommitDate }}"
      - src: README.md
        info:
          mtime: "{{ .CommitDate }}"
      - src: deploy/helm/**/*
        info:
          mtime: "{{ .CommitDate }}"
      - src: deploy/compose/*
        info:
          mtime: "{{ .CommitDate }}"
      - src: deploy/docker/*
        info:
          mtime: "{{ .CommitDate }}"
      # the example GitOps repository: the published server image (scripts/build-image-crane.sh, IMAGE_SOURCE=dist) takes it
      # from this archive, so everything in the image is covered by checksums.txt
      - src: examples/quickstart
        info:
          mtime: "{{ .CommitDate }}"

  # myriarch-updater including install scripts, templates and service files (self-contained package for hosts)
  - id: myriarch-updater
    ids: [myriarch-updater]
    formats: [tar.gz]
    format_overrides:
      - {goos: windows, formats: [zip]}
    name_template: "myriarch-updater_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds_info:
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info:
          mtime: "{{ .CommitDate }}"
      - src: THIRD_PARTY_NOTICES
        info:
          mtime: "{{ .CommitDate }}"
      - src: deploy/scripts/*
        dst: deploy/scripts
        strip_parent: true
        info:
          mtime: "{{ .CommitDate }}"
      - src: deploy/supervisor/**/*
        dst: deploy/supervisor
        info:
          mtime: "{{ .CommitDate }}"
      - src: deploy/systemd/*
        dst: deploy/systemd
        strip_parent: true
        info:
          mtime: "{{ .CommitDate }}"
      - src: deploy/updater/**/*
        dst: deploy/updater
        info:
          mtime: "{{ .CommitDate }}"
      - src: deploy/windows/*
        dst: deploy/windows
        strip_parent: true
        info:
          mtime: "{{ .CommitDate }}"

  # bare binaries: target of install-linux.sh --updater-url / install-windows.ps1 -UpdaterUrl
  - id: myriarch-updater-binary
    ids: [myriarch-updater]
    formats: [binary]
    name_template: "myriarch-updater_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds_info:
      mtime: "{{ .CommitDate }}"

  - id: myrctl
    ids: [myrctl]
    formats: [tar.gz]
    format_overrides:
      - {goos: windows, formats: [zip]}
    name_template: "myrctl_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds_info:
      mtime: "{{ .CommitDate }}"
    # explicit list: it replaces the goreleaser default (LICEN[CS]E*, README*, CHANGELOG*), so README and CHANGELOG are named
    files:
      - src: LICENSE
        info:
          mtime: "{{ .CommitDate }}"
      - src: THIRD_PARTY_NOTICES
        info:
          mtime: "{{ .CommitDate }}"
      - src: README.md
        info:
          mtime: "{{ .CommitDate }}"
      - src: CHANGELOG.md
        info:
          mtime: "{{ .CommitDate }}"

  - id: myriarch-sim
    ids: [myriarch-sim]
    formats: [tar.gz]
    name_template: "myriarch-sim_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds_info:
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info:
          mtime: "{{ .CommitDate }}"
      - src: THIRD_PARTY_NOTICES
        info:
          mtime: "{{ .CommitDate }}"
      - src: examples/sim/*
        info:
          mtime: "{{ .CommitDate }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Signing (mandatory for releases): cosign v3 with a KEY (ECDSA P-256), without an upload to a public transparency log
# (deploy/release/README.md). contrib/enterprise-mirror/sign-blob.sh calls cosign sign-blob and re-verifies the signature
# with openssl. Format contract: <file>.sig = base64 of an ASN.1 DER ECDSA signature over the SHA-256 of the file -
# verifiable with
#   openssl dgst -sha256 -verify cosign.pub -signature <(openssl base64 -d -A -in <file>.sig) <file>
# The install scripts (deploy/scripts) verify checksums.txt with it; the hashes of the binaries come from that file.
# Key: COSIGN_KEY (key file or any KMS URI cosign supports), COSIGN_PASSWORD - set by ci/build-release.sh.
# INTERIM: key-based signing stays until the GitHub release workflow signs keyless (ADR-0023); the three
# entries below (checksum, binary, archive) are asserted by a Go test and carry over.
signs:
  - id: checksums
    cmd: bash
    signature: "${artifact}.sig"
    args: [contrib/enterprise-mirror/sign-blob.sh, "${artifact}", "${signature}"]
    artifacts: checksum
    output: true
  - id: binaries
    cmd: bash
    signature: "${artifact}.sig"
    args: [contrib/enterprise-mirror/sign-blob.sh, "${artifact}", "${signature}"]
    artifacts: binary
    output: true
  - id: archives
    cmd: bash
    signature: "${artifact}.sig"
    args: [contrib/enterprise-mirror/sign-blob.sh, "${artifact}", "${signature}"]
    artifacts: archive
    output: true

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

# No release publishing here: the release page and keyless signing come with the GitHub release workflow (ADR-0023).
# Until then `goreleaser release` must run with --skip=publish (ci/build-release.sh does).
release:
  disable: true
