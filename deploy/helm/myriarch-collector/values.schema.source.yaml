# The hand-written source of the values schema of the chart (values.schema.json). `make docs-gen` turns this file into the schema: it
# adds the generator comment and writes JSON in the order of this file. Edit this file, never values.schema.json, and run
# `make docs-gen`. The server chart does the same (deploy/helm/myriarch/values.schema.source.yaml); this chart has no generated block.
#
# The file is JSON Schema (draft 2020-12) written as YAML: comments and regular expressions without a second level of escaping.
# It may say only what JSON can say (no anchors, no merge keys, no time stamps; quote a string that looks like one).
#
# Rules of the schema:
#  - The schema is strict. Every object that the chart defines is closed (additionalProperties: false), so a key that the chart does
#    not read is an error instead of being ignored. The few open objects hold Kubernetes API objects that the chart passes through
#    and the API server validates; each has additionalProperties: true on purpose, and the test
#    internal/updater/deploy_collector_chart_test.go lists them.
#  - A value has the type that the template needs. A string pattern is the syntax of the receiving system (a Kubernetes name, a
#    quantity, a registry host); a rule that relates two values stays in the templates (templates/_helpers.tpl, "checks").
#  - Secrets are not values. The schema has no key for an enrollment token; the chart reads it from a Secret that you create, and a
#    reference to a Secret never has the form of an enrollment token.
#  - Defaults are in values.yaml only.
#  - null is not a value, except in the string maps of the chart itself and in global.imageRegistry.
$schema: https://json-schema.org/draft/2020-12/schema
title: Values of the myriarch-collector chart
description: >-
  Values of the Helm chart myriarch-collector, which runs an OpenTelemetry Collector with the OpAMP Supervisor from the unchanged
  upstream images, managed by the Myriarch server. The schema is strict: helm install, upgrade, template and lint refuse a key that
  the chart does not know, a value of the wrong type and a malformed value. Secrets are not values: the chart reads the enrollment
  token from a Kubernetes Secret.
type: object
additionalProperties: false
properties:
  mode:
    description: >-
      statefulset - a gateway with a stable identity per replica (a PVC). daemonset - one collector per node.
    enum: [statefulset, daemonset]
  replicaCount:
    description: Number of replicas of the StatefulSet. Every replica is its own OpAMP agent. The DaemonSet ignores it.
    type: integer
    minimum: 0

  images:
    description: >-
      The three images of the pod. Each has a tag and an optional digest; with a digest the image is referenced as repository@digest
      and the tag is ignored.
    type: object
    additionalProperties: false
    properties:
      updater:
        description: myriarch-updater, the init container that copies itself to the shared volume and, in container mode, PID 1.
        $ref: '#/$defs/image'
      collector:
        description: The unchanged upstream collector image (contrib distribution); an init container copies its binary.
        $ref: '#/$defs/image'
      supervisor:
        description: The unchanged upstream OpAMP Supervisor image, the main container.
        $ref: '#/$defs/image'
  imagePullSecrets:
    description: Secrets for pulling the images from a private registry.
    type: array
    items:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          description: Name of the Secret in the release namespace.
          $ref: '#/$defs/name'

  nameOverride:
    description: Overrides the chart name in resource names.
    type: string
  fullnameOverride:
    description: Overrides the complete resource name.
    type: string

  global:
    description: >-
      Values that a parent chart shares with its subcharts. This chart reads only global.imageRegistry; other keys belong to other
      charts and are not checked.
    type: object
    additionalProperties: true
    properties:
      imageRegistry:
        description: >-
          Registry host, with an optional port, that replaces images.*.registry, for example the host of a mirror. A repository that
          has a registry host of its own is not affected. A parent chart may pass null for no mirror.
        anyOf:
          - $ref: '#/$defs/registryHost'
          - type: 'null'
  enabled:
    description: >-
      Read by the dependency condition of a parent chart, not by this chart, which ignores it. It has no default and no effect on a
      standalone installation.
    type: boolean

  serviceAccount:
    description: The ServiceAccount of the pods. Its token is not mounted unless automountToken is set.
    type: object
    additionalProperties: false
    properties:
      create:
        description: Create the ServiceAccount.
        type: boolean
      name:
        description: Name of the ServiceAccount. Empty means a name generated from the release name.
        $ref: '#/$defs/nameOrEmpty'
      annotations:
        description: Annotations of the ServiceAccount.
        $ref: '#/$defs/stringMap'
      automountToken:
        description: >-
          Mount the API token into the pod. Off by default: the pod runs configuration from Git. Turn it on only with a dedicated
          ServiceAccount whose Role is read-only, for a collector that needs the Kubernetes API.
        type: boolean

  server:
    description: The connection to the Myriarch server.
    type: object
    additionalProperties: false
    properties:
      endpoint:
        description: >-
          OpAMP endpoint of the Myriarch server. wss:// is the default; ws:// is refused unless allowInsecureTransport is true.
        type: string
        pattern: '^wss?://[^\s"]+$'
      allowInsecureTransport:
        description: >-
          Explicit opt-in to an unencrypted ws:// endpoint. The enrollment token then travels in clear text.
        type: boolean
      tls:
        description: The CA bundle that signs the certificate of the server, for a server with a private CA.
        type: object
        additionalProperties: false
        properties:
          existingSecret:
            description: Name of an existing Secret with the CA bundle. Empty means none. Not together with existingConfigMap.
            $ref: '#/$defs/nameOrEmpty'
          existingConfigMap:
            description: Name of an existing ConfigMap with the CA bundle. Empty means none. Not together with existingSecret.
            $ref: '#/$defs/nameOrEmpty'
          key:
            description: Key of the PEM bundle in the Secret or ConfigMap.
            $ref: '#/$defs/secretKey'

  enrollment:
    description: The enrollment token of the collectors, which the chart reads from an existing Secret.
    type: object
    additionalProperties: false
    properties:
      existingSecret:
        description: Name of the Secret in the release namespace.
        $ref: '#/$defs/name'
      key:
        description: Key of the token in the Secret.
        $ref: '#/$defs/secretKey'

  site:
    description: The site attributes that every agent of the release reports; the fleets of the server match on them.
    type: object
    additionalProperties: false
    properties:
      type:
        description: site.type. Empty means k8s-gateway for the StatefulSet and k8s-node for the DaemonSet.
        $ref: '#/$defs/attribute'
      id:
        description: site.id.
        $ref: '#/$defs/attribute'
      name:
        description: site.name.
        $ref: '#/$defs/attribute'
      country:
        description: site.country.
        $ref: '#/$defs/attribute'
      region:
        description: site.region.
        $ref: '#/$defs/attribute'
      timezone:
        description: site.timezone.
        $ref: '#/$defs/attribute'
      environment:
        description: deployment.environment.name.
        $ref: '#/$defs/attribute'
      clusterName:
        description: k8s.cluster.name.
        $ref: '#/$defs/attribute'

  extraEnv:
    description: >-
      Additional environment variables of the main container, in the format of a Kubernetes container. The collector inherits the
      environment of the supervisor.
    type: array
    items:
      $ref: '#/$defs/envVar'
  extraEnvFrom:
    description: Additional environment sources (Secrets, ConfigMaps) of the main container, in the format of a Kubernetes container.
    type: array
    items:
      type: object
      additionalProperties: true

  ports:
    description: >-
      The ports of the receivers of the collector configuration: declared on the container, offered by the Service of the StatefulSet
      and allowed by the NetworkPolicy. The health ports are always declared.
    type: array
    items:
      type: object
      additionalProperties: false
      required: [name, port]
      properties:
        name:
          description: Port name, at most 15 characters from lower case letters, digits and "-".
          type: string
          pattern: '^[a-z0-9]([-a-z0-9]{0,13}[a-z0-9])?$'
          not:
            enum: [health, sup-health, updater-health]
        port:
          $ref: '#/$defs/port'
        protocol:
          enum: [TCP, UDP]
  service:
    description: The Service of the StatefulSet for the ports above. The DaemonSet has none.
    type: object
    additionalProperties: false
    properties:
      enabled:
        description: Create the Service.
        type: boolean
      type:
        description: Service type.
        enum: [ClusterIP, NodePort, LoadBalancer]
      annotations:
        description: Annotations of the Service.
        $ref: '#/$defs/stringMap'

  persistence:
    description: >-
      Where the instance UID of the collector lives. The StatefulSet uses a PVC per replica. The DaemonSet uses an emptyDir (a new
      agent after every restart) unless hostPath is enabled.
    type: object
    additionalProperties: false
    properties:
      size:
        description: StatefulSet - size of the PVC "storage" of every replica.
        $ref: '#/$defs/quantity'
      storageClass:
        description: StatefulSet - storage class of the PVC. Empty means the default class.
        $ref: '#/$defs/nameOrEmpty'
      accessModes:
        description: StatefulSet - access modes of the PVC.
        type: array
        minItems: 1
        items:
          enum: [ReadWriteOnce, ReadWriteMany, ReadWriteOncePod]
      hostPath:
        description: >-
          DaemonSet - keep the identity on the node. A hostPath volume is not allowed by the Pod Security levels baseline and
          restricted. The chart has no root init container: prepare a directory that the pod user (10001 by default) can write.
        type: object
        additionalProperties: false
        properties:
          enabled:
            description: Use a hostPath volume for the storage directory.
            type: boolean
          path:
            description: Absolute directory on the node. Empty means /var/lib/myriarch/<fullname>.
            $ref: '#/$defs/absolutePathOrEmpty'
          type:
            description: Type of the hostPath volume.
            enum: [DirectoryOrCreate, Directory]

  nodeLogs:
    description: >-
      DaemonSet - read-only access to the logs of the node, for a filelog receiver. It is the one hostPath of the chart that is not
      about identity.
    type: object
    additionalProperties: false
    properties:
      enabled:
        description: Mount the logs of the node read-only.
        type: boolean
      hostPath:
        description: Absolute directory on the node.
        $ref: '#/$defs/absolutePath'
      mountPath:
        description: Absolute mount path in the container.
        $ref: '#/$defs/absolutePath'

  containerMode:
    description: >-
      Optional container mode: myriarch-updater is PID 1 of the main container and swaps the collector binary on a persistent volume.
      StatefulSet only.
    type: object
    additionalProperties: false
    properties:
      enabled:
        description: Run the updater as PID 1 of the main container.
        type: boolean
      binaries:
        description: The second volumeClaimTemplate "binaries" for the versions of the collector and the state of the updater.
        type: object
        additionalProperties: false
        properties:
          size:
            description: Size of the PVC "binaries".
            $ref: '#/$defs/quantity'
          storageClass:
            description: Storage class of the PVC. Empty means the default class.
            $ref: '#/$defs/nameOrEmpty'
      seedPolicy:
        description: >-
          newest - the higher version wins, a tie keeps the volume. image - the binary of the image is always activated (emergency switch).
        enum: [newest, image]
      keepVersions:
        description: Versions of the collector kept on the volume, at least 2.
        type: integer
        minimum: 2
      update:
        description: The behaviour of an update.
        type: object
        additionalProperties: false
        properties:
          requireSignature:
            description: Verify the Sigstore bundle of a downloaded collector. Needs trustedRoot.existingConfigMap.
            type: boolean
          healthTimeout:
            description: Time to wait for the health check after a swap.
            $ref: '#/$defs/duration'
      trustedRoot:
        description: The Sigstore trusted root for the offline verification.
        type: object
        additionalProperties: false
        properties:
          existingConfigMap:
            description: Name of an existing ConfigMap with the trusted root. Empty means none.
            $ref: '#/$defs/nameOrEmpty'
          key:
            description: Key of the trusted root in the ConfigMap.
            $ref: '#/$defs/secretKey'
      stopTimeout:
        description: Time from SIGTERM to SIGKILL for the supervisor.
        $ref: '#/$defs/duration'

  resources:
    description: Resource requests and limits of the main container.
    $ref: '#/$defs/resources'
  initResources:
    description: Resource requests and limits of the two init containers.
    $ref: '#/$defs/resources'
  terminationGracePeriodSeconds:
    description: >-
      Grace period of the pod on termination, in seconds. In container mode the pod gets at least 360.
    type: integer
    minimum: 0

  podSecurityContext:
    description: >-
      Security context of the pod, in the format of a Kubernetes pod. The standard profile defaults runAsUser, runAsGroup and fsGroup
      to 10001 (null leaves a field out). The OpenShift profile drops runAsUser, runAsGroup, fsGroup and fsGroupChangePolicy. Other fields are passed through and validated by the API server.
    type: object
    additionalProperties: true
    properties:
      runAsNonRoot:
        type: boolean
      runAsUser:
        type: integer
        minimum: 0
      runAsGroup:
        type: integer
        minimum: 0
      fsGroup:
        type: integer
        minimum: 0
      fsGroupChangePolicy:
        enum: [OnRootMismatch, Always]
      seccompProfile:
        type: object
        additionalProperties: true
        properties:
          type:
            enum: [RuntimeDefault, Localhost, Unconfined]
  securityContext:
    description: >-
      Security context of every container, in the format of a Kubernetes container. Other fields are passed through and validated by
      the API server.
    type: object
    additionalProperties: true
    properties:
      allowPrivilegeEscalation:
        type: boolean
      readOnlyRootFilesystem:
        type: boolean
      privileged:
        type: boolean
      runAsNonRoot:
        type: boolean
      runAsUser:
        type: integer
        minimum: 0
      runAsGroup:
        type: integer
        minimum: 0
      capabilities:
        type: object
        additionalProperties: false
        properties:
          add:
            type: array
            items:
              type: string
          drop:
            type: array
            items:
              type: string
      seccompProfile:
        type: object
        additionalProperties: true
        properties:
          type:
            enum: [RuntimeDefault, Localhost, Unconfined]
  tmpSizeLimit:
    description: Size limit of the emptyDir for /tmp.
    $ref: '#/$defs/quantity'
  sharedSizeLimit:
    description: Size limit of the emptyDir "shared" that holds the updater and the seeded collector binary.
    $ref: '#/$defs/quantity'

  tolerations:
    description: Tolerations of the pods.
    type: array
    items:
      type: object
      additionalProperties: false
      properties:
        key:
          type: string
        operator:
          enum: [Exists, Equal]
        value:
          type: string
        effect:
          enum: ['', NoSchedule, PreferNoSchedule, NoExecute]
        tolerationSeconds:
          type: integer
  nodeSelector:
    description: Node selector of the pods.
    $ref: '#/$defs/stringMap'
  affinity:
    description: Affinity of the pods, in the format of a Kubernetes pod.
    type: object
    additionalProperties: false
    properties:
      nodeAffinity:
        type: object
        additionalProperties: true
      podAffinity:
        type: object
        additionalProperties: true
      podAntiAffinity:
        type: object
        additionalProperties: true
  topologySpreadConstraints:
    description: >-
      Spreads the replicas, in the format of a Kubernetes pod. The chart adds the label selector of the release to every entry.
    type: array
    items:
      type: object
      additionalProperties: true
      properties:
        maxSkew:
          type: integer
          minimum: 1
        topologyKey:
          type: string
          minLength: 1
        whenUnsatisfiable:
          enum: [DoNotSchedule, ScheduleAnyway]
  priorityClassName:
    description: Priority class of the pods.
    $ref: '#/$defs/nameOrEmpty'
  podAnnotations:
    description: Annotations of the pods.
    $ref: '#/$defs/stringMap'
  podLabels:
    description: Additional labels of the pods.
    $ref: '#/$defs/stringMap'
  updateStrategy:
    description: Update strategy of the DaemonSet.
    type: object
    additionalProperties: false
    properties:
      maxUnavailable:
        description: Maximum number or percentage of unavailable pods during a rolling update.
        $ref: '#/$defs/intOrPercent'

  extraVolumes:
    description: Additional volumes of the pod, in the format of a Kubernetes pod.
    type: array
    items:
      type: object
      additionalProperties: true
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
  extraVolumeMounts:
    description: Additional volume mounts of the main container, in the format of a Kubernetes container.
    type: array
    items:
      type: object
      additionalProperties: true
      required: [name, mountPath]
      properties:
        name:
          type: string
          minLength: 1
        mountPath:
          type: string
          minLength: 1
        readOnly:
          type: boolean
        subPath:
          type: string

  openshift:
    description: >-
      The OpenShift profile (Security Context Constraints restricted-v2). true - the profile is on. false - the standard Kubernetes
      profile. auto - the profile is on when the cluster offers the API security.openshift.io/v1; "helm template" renders the standard
      profile unless it gets --api-versions security.openshift.io/v1. The profile drops runAsUser, runAsGroup and fsGroup from
      podSecurityContext, so the SCC assigns them.
    type: object
    additionalProperties: false
    properties:
      enabled:
        description: true, false or auto.
        enum: [true, false, auto]

  networkPolicy:
    description: >-
      Ingress segmentation of the pods. Egress stays open, because the destinations differ per environment. The cluster needs a CNI
      with NetworkPolicy support.
    type: object
    additionalProperties: false
    properties:
      enabled:
        description: Create the NetworkPolicy.
        type: boolean
      ingress:
        description: The sources of the ports.
        type: object
        additionalProperties: false
        properties:
          allowSameNamespace:
            description: Allow every pod of the release namespace to reach the ports.
            type: boolean
          from:
            description: Further sources of the ports in NetworkPolicy "from" format.
            type: array
            items:
              $ref: '#/$defs/networkPolicyPeer'

$defs:
  image:
    description: An image of the pod.
    type: object
    additionalProperties: false
    properties:
      registry:
        description: >-
          Registry host, with an optional port, of the image, for example ghcr.io. It applies when repository has no registry host of
          its own, and global.imageRegistry takes precedence over it. Empty means the default registry of the container runtime.
        $ref: '#/$defs/registryHost'
      repository:
        description: >-
          Repository of the image without a registry host, for example myriarch/myriarch-updater. A repository that starts with a
          registry host is used unchanged and neither registry nor global.imageRegistry applies.
        type: string
        minLength: 1
        maxLength: 255
        pattern: '^((localhost|[a-zA-Z0-9]([-a-zA-Z0-9]*[a-zA-Z0-9])?(\.[a-zA-Z0-9]([-a-zA-Z0-9]*[a-zA-Z0-9])?)+)(:[0-9]+)?/|[a-zA-Z0-9]([-a-zA-Z0-9]*[a-zA-Z0-9])?:[0-9]+/)?[a-z0-9]+(([._]|__|-+)[a-z0-9]+)*(/[a-z0-9]+(([._]|__|-+)[a-z0-9]+)*)*$'
      tag:
        description: Image tag. Empty means the appVersion of the chart.
        type: string
        pattern: '^([A-Za-z0-9_][A-Za-z0-9_.-]{0,127})?$'
      digest:
        description: >-
          Image digest, sha256: followed by 64 hexadecimal characters. When set, the image is referenced as repository@digest and the
          tag is ignored.
        type: string
        pattern: '^(sha256:[0-9a-f]{64})?$'
      pullPolicy:
        description: Image pull policy.
        enum: [Always, IfNotPresent, Never]
  resources:
    description: Resource requests and limits, in the format of a Kubernetes container.
    type: object
    additionalProperties: false
    properties:
      requests:
        $ref: '#/$defs/quantityMap'
      limits:
        $ref: '#/$defs/quantityMap'
  attribute:
    description: The value of a site attribute; any text without line breaks, or empty.
    type: string
    maxLength: 253
    pattern: '^[^\r\n]*$'
  absolutePath:
    description: An absolute path without a space or a quote.
    type: string
    pattern: '^/[^\s"]*$'
  absolutePathOrEmpty:
    description: An absolute path without a space or a quote, or empty when the setting is not used.
    type: string
    pattern: '^(/[^\s"]*)?$'
  duration:
    description: A duration such as 30s, 5m or 1h30m.
    type: string
    pattern: '^([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+$'
  name:
    description: The name of a Kubernetes object, a DNS-1123 subdomain.
    type: string
    minLength: 1
    maxLength: 253
    pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
  nameOrEmpty:
    description: The name of a Kubernetes object, a DNS-1123 subdomain, or empty when the setting is not used.
    type: string
    maxLength: 253
    pattern: '^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*)?$'
  secretKey:
    description: >-
      The key of a Secret or ConfigMap, from letters, digits, "-", "_" and ".". It names an entry; it is never the value of an
      enrollment token.
    type: string
    minLength: 1
    maxLength: 253
    pattern: '^[-._a-zA-Z0-9]+$'
    not:
      pattern: '^myre_'
  registryHost:
    description: A registry host with an optional port, for example ghcr.io or registry.example.com:5000. Empty when not used.
    type: string
    maxLength: 261
    pattern: '^(([A-Za-z0-9]([-A-Za-z0-9]*[A-Za-z0-9])?(\.[A-Za-z0-9]([-A-Za-z0-9]*[A-Za-z0-9])?)*|\[[0-9A-Fa-f:.]+\])(:[0-9]{1,5})?)?$'
  port:
    description: A TCP or UDP port.
    type: integer
    minimum: 1
    maximum: 65535
  cidr:
    description: An IPv4 or IPv6 network in CIDR notation, for example 169.254.0.0/16.
    type: string
    pattern: '^([0-9]{1,3}(\.[0-9]{1,3}){3}/[0-9]{1,2}|[0-9A-Fa-f:]*:[0-9A-Fa-f:.]*/[0-9]{1,3})$'
  quantity:
    description: A Kubernetes quantity, a number or a string such as 500m, 512Mi or 5Gi.
    anyOf:
      - type: number
        minimum: 0
      - type: string
        pattern: '^[+]?([0-9]+(\.[0-9]*)?|\.[0-9]+)(Ki|Mi|Gi|Ti|Pi|Ei|[numkMGTPE]|[eE][+-]?[0-9]+)?$'
  quantityMap:
    description: Quantities by resource name, for example cpu, memory and ephemeral-storage.
    type: object
    additionalProperties:
      $ref: '#/$defs/quantity'
  intOrPercent:
    description: A number of pods or a percentage of the pods, for example 1 or 50%.
    anyOf:
      - type: integer
        minimum: 0
      - type: string
        pattern: '^[0-9]+%$'
  stringMap:
    description: >-
      A map from strings to strings. An entry may be null: the values files of the examples switch off an entry of an earlier
      values file that way, and Helm keeps such a null for a key that values.yaml does not define.
    type: object
    additionalProperties:
      type: [string, 'null']
  labelSelector:
    description: A Kubernetes label selector.
    type: object
    additionalProperties: false
    properties:
      matchLabels:
        $ref: '#/$defs/stringMap'
      matchExpressions:
        type: array
        items:
          type: object
          additionalProperties: true
  networkPolicyPeer:
    description: A source of a NetworkPolicy rule, with exactly one of its selectors.
    type: object
    additionalProperties: false
    properties:
      podSelector:
        $ref: '#/$defs/labelSelector'
      namespaceSelector:
        $ref: '#/$defs/labelSelector'
      ipBlock:
        type: object
        additionalProperties: false
        required: [cidr]
        properties:
          cidr:
            $ref: '#/$defs/cidr'
          except:
            type: array
            items:
              $ref: '#/$defs/cidr'
  envVar:
    description: An environment variable in the format of a Kubernetes container.
    type: object
    additionalProperties: false
    required: [name]
    properties:
      name:
        type: string
        minLength: 1
      value:
        type: string
      valueFrom:
        type: object
        additionalProperties: true
