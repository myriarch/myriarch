apiVersion: v2
name: myriarch-collector
description: "OpenTelemetry Collector with the OpAMP Supervisor from the unchanged upstream images, managed by the Myriarch server (StatefulSet or DaemonSet)"
type: application
version: 0.2.0
appVersion: "0.2.0"
kubeVersion: ">=1.30.0-0"
keywords: [opamp, opentelemetry, opentelemetry-collector, fleet-management]
home: https://myriarch.dev
icon: https://myriarch.dev/brand/myriarch-icon.svg
sources:
  - https://github.com/myriarch/myriarch
maintainers:
  - name: The Myriarch Authors
    email: maintainers@myriarch.dev
    url: https://myriarch.dev
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: monitoring-logging
  artifacthub.io/operator: "false"
  artifacthub.io/links: |
    - name: Documentation
      url: https://myriarch.dev/docs/
    - name: Source code
      url: https://github.com/myriarch/myriarch
    - name: Issues
      url: https://github.com/myriarch/myriarch/issues
    - name: Security policy
      url: https://github.com/myriarch/myriarch/security/policy
  # The images of the chart, for the security reports of Artifact Hub. The first entry is a placeholder: the release job completes it with
  # the digest of the updater image of the release before it packages the chart. The two upstream images are pinned in the repository
  # (ci/versions.env, kept equal by ci/check.sh).
  artifacthub.io/images: |
    - name: myriarch-updater
      image: ghcr.io/myriarch/myriarch-updater
      platforms:
        - linux/amd64
        - linux/arm64
    - name: opampsupervisor
      image: docker.io/otel/opentelemetry-collector-opampsupervisor@sha256:13af4526381fe8279fb78f211628fea5cae693bf413737f234ee3587d9a44fb6
      platforms:
        - linux/amd64
        - linux/arm64
    - name: otelcol-contrib
      image: docker.io/otel/opentelemetry-collector-contrib@sha256:39923a8e431bd1f57be82411999d389fcfe40857492e4365456d97a4c1f74be6
      platforms:
        - linux/amd64
        - linux/arm64
