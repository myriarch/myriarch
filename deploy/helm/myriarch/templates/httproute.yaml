{{- if .Values.httpRoute.enabled }}
{{- $_ := include "myriarch.checkIngressSources" . }}
{{- if not .Values.httpRoute.parentRefs }}
{{- fail "httpRoute.parentRefs: must not be empty when httpRoute.enabled is true; bind the route to a Gateway" }}
{{- end }}
{{- if not .Values.httpRoute.hostnames }}
{{- fail "httpRoute.hostnames: must not be empty when httpRoute.enabled is true; list the host names of the route (they must match config.server.publicUrl)" }}
{{- end }}
{{- if and (not .Values.config.server.trustedProxies) (not .Values.httpRoute.allowWithoutTrustedProxies) }}
{{- fail "config.server.trustedProxies: must not be empty when httpRoute.enabled is true; without the CIDR of the Gateway data plane myriarchd sees all clients as one address (login rate limit, audit source address). Set the CIDR, or set httpRoute.allowWithoutTrustedProxies=true if the client address is deliberately not evaluated" }}
{{- end }}
{{- if and (hasPrefix "https://" (.Values.config.server.publicUrl | default "")) (not .Values.httpRoute.tlsTerminatedAtGateway) }}
{{- fail "httpRoute.tlsTerminatedAtGateway: must be true when config.server.publicUrl uses https; terminate TLS at the Gateway listener and confirm it with httpRoute.tlsTerminatedAtGateway=true" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "myriarch.fullname" . }}
  labels:
    {{- include "myriarch.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  hostnames:
    {{- toYaml .Values.httpRoute.hostnames | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "myriarch.fullname" . }}
          port: {{ .Values.service.port }}
      {{- with .Values.httpRoute.timeouts }}
      timeouts:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
