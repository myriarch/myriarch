{{- /*
  Enrollment tokens without enrollmentTokens[].existingSecret: one Secret per entry with a random token (myre_ followed
  by 40 letters and digits). The value is kept across upgrades through lookup. Under "helm template" lookup returns
  nothing, so the value changes on every render: GitOps tools that render offline must use existingSecret.
*/ -}}
{{- range .Values.enrollmentTokens }}
{{- if not .existingSecret }}
{{- $name := include "myriarch.enrollment.secretName" (dict "root" $ "entry" .) }}
{{- $key := .key | default "token" }}
{{- $token := printf "myre_%s" (randAlphaNum 40) }}
{{- $existing := lookup "v1" "Secret" $.Release.Namespace $name }}
{{- if and $existing $existing.data (hasKey $existing.data $key) }}
{{- $token = index $existing.data $key | b64dec }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "myriarch.labels" $ | nindent 4 }}
type: Opaque
data:
  {{ $key }}: {{ $token | b64enc }}
{{- end }}
{{- end }}
