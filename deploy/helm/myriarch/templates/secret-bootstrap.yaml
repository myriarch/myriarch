{{- /*
  One-time token of the bootstrap admin, generated while the chart renders the bootstrap admin without
  bootstrapAdmin.existingSecret. The value is kept across upgrades through lookup. Under "helm template" lookup returns
  nothing, so the value changes on every render: GitOps tools that render offline must use existingSecret.
*/ -}}
{{- if and (include "myriarch.bootstrap.active" .) (not .Values.bootstrapAdmin.existingSecret) }}
{{- $name := include "myriarch.bootstrap.secretName" . }}
{{- $key := include "myriarch.bootstrap.tokenKey" . }}
{{- $token := randAlphaNum 48 }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing $existing.data (hasKey $existing.data $key) }}
{{- $token = index $existing.data $key | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "myriarch.labels" . | nindent 4 }}
type: Opaque
data:
  {{ $key }}: {{ $token | b64enc }}
{{- end }}
