apiVersion: v1
kind: Service
metadata:
  name: {{ include "myriarch.fullname" . }}
  labels:
    {{- include "myriarch.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  # no session affinity: every replica serves every agent
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    - name: metrics
      port: {{ .Values.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "myriarch.selectorLabels" . | nindent 4 }}
