{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "myriarch.serviceAccountName" . }}
  labels:
    {{- include "myriarch.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# myriarchd needs no Kubernetes API access
automountServiceAccountToken: false
{{- end }}
