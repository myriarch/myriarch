# Myriarch - OpAMP supervisor configuration (Windows, service otelcol-supervisor)
#
# Template for deploy/scripts/install-windows.ps1. Placeholders in double at-signs (for example OPAMP_ENDPOINT) are
# replaced by the script (values are escaped for YAML double quotes). Lines with an
# empty placeholder value are removed; without -CaFile, "tls:" and "ca_file:" are dropped.
# Paths with backslashes are in single quotes (literal).
#
# The token comes from the service environment (registry, REG_MULTI_SZ "Environment"
# under HKLM\SYSTEM\CurrentControlSet\Services\otelcol-supervisor), never from this file.
server:
  endpoint: "@@OPAMP_ENDPOINT@@"
  headers:
    Authorization: "Bearer ${env:MYRIARCH_ENROLLMENT_TOKEN}"
  tls:
    ca_file: "@@CA_FILE@@"
capabilities:
  accepts_remote_config: true
  accepts_restart_command: true
  reports_effective_config: true
  reports_health: true
  reports_available_components: true
  reports_heartbeat: true
  reports_own_metrics: false
  accepts_opamp_connection_settings: false
agent:
  # Copy managed by myriarch-updater (Windows: copy instead of symlink).
  executable: 'C:\Program Files\Myriarch\collector\bin\otelcol-contrib.exe'
  config_apply_timeout: 30s
  bootstrap_timeout: 15s
  validate_config: true
  automatic_config_rollback: true
  startup_fallback_configs: ['C:\ProgramData\Myriarch\config\fallback.yaml']
  description:
    non_identifying_attributes:
      site.type: "@@SITE_TYPE@@"
      site.id: "@@SITE_ID@@"
      site.name: "@@SITE_NAME@@"
      site.country: "@@SITE_COUNTRY@@"
      site.region: "@@SITE_REGION@@"
      site.timezone: "@@SITE_TIMEZONE@@"
      deployment.environment.name: "@@ENVIRONMENT@@"
# Do not pre-populate (golden images!): persistent_state.yaml holds the instance UID.
storage:
  directory: 'C:\ProgramData\Myriarch\supervisor'
healthcheck:
  endpoint: localhost:13134
telemetry:
  logs: {level: info}
