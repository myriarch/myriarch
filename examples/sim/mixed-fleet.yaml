# myriarch-sim profile "mixed-fleet": a generic mixed fleet for local demos and load runs, matching the quickstart
# GitOps repository (examples/quickstart).
#
# The group weights are scaled to --agents (largest remainder method). At 1000 agents this gives exactly
# 400 linux-edge, 200 linux-datacenter, 300 windows-edge and 100 k8s-gateway collectors, and 900 myriarch-updaters
# (every group with updater: true). Each simulated supervisor reports its attributes like a real installation
# (non_identifying_attributes).
#
# The first host of each group matches a canary entry of examples/quickstart/inventory/waves.yaml:
#   linux-edge     linux-edge-01.example.com  site edge-001
#   windows-edge   WIN-EDGE-01                site edge-001 (shares the site with the first Linux edge host)
#   linux-datacenter linux-dc-01.example.com  site dc-01
#   k8s-gateway    otel-gateway-1             site cloud-01
seed: 42
components: components-otelcol-contrib-0.162.0.json   # relative to this file
groups:
  - name: linux-edge
    weight: 40
    os: linux
    arch: amd64
    version: 0.161.0
    updater: true
    hostnamePattern: "linux-edge-%02d.example.com"
    siteIdPattern: "edge-%03d"
    attributes:
      site.type: edge
      site.country: NL
      site.timezone: Europe/Amsterdam
      deployment.environment.name: production
  - name: linux-datacenter
    weight: 20
    os: linux
    arch: arm64
    version: 0.162.0
    updater: true
    hostnamePattern: "linux-dc-%02d.example.com"
    siteIdPattern: "dc-%02d"
    attributes:
      site.type: datacenter
      site.country: NL
      site.timezone: UTC
      deployment.environment.name: production
  - name: windows-edge
    weight: 30
    os: windows
    arch: amd64
    version: 0.161.0
    updater: true
    hostnamePattern: "WIN-EDGE-%02d"
    siteIdPattern: "edge-%03d"
    attributes:
      site.type: edge
      site.country: NL
      site.timezone: Europe/Amsterdam
      deployment.environment.name: production
  - name: k8s-gateway
    weight: 10
    os: linux
    arch: amd64
    version: 0.162.0
    updater: false          # the version changes through the container image
    hostnamePattern: "otel-gateway-%d"
    siteIdPattern: "cloud-01"
    attributes:
      site.type: cloud
      site.country: ZZ
      site.timezone: UTC
      deployment.environment.name: production
behavior:
  connectRate: 100            # new connections per second (ramp-up)
  heartbeatInterval: 30s
  configApplyDelay: 1s-5s     # random duration APPLYING -> APPLIED
  configFailureRate: 0.0      # probability that a config apply fails
  failConfigsContaining: "simulate-config-failure"   # configs containing this text always fail
  unhealthyAfterApplyRate: 0.0
  restartDuration: 3s
  startupDuration: 1s-2s      # after a restart the supervisor reports {healthy:false}, then StatusStarting, then StatusOK
  reconnectOnUpgrade: true    # a version change restarts the supervisor: the connection drops, a new client connects
  validateConfig: true        # like validate_config in the supervisor: FAILED, then the old config keeps running (no APPLIED)
  updaterInstallDuration: 10s-40s
  updateFailureRate: 0.0
  versionAfterUpdate: offered # the simulated collector reports the offered version after an update
  offlineChurnRate: 0.0       # share of agents that briefly go offline at random (per minute)
