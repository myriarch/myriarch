# Config rollouts: first the wave "canary" (hosts with the inventory label wave=canary, see inventory/waves.yaml),
# then - after manual approval in the UI - all remaining hosts.
# A broken config rolls back automatically (onFailure: rollback). A single failure triggers it.
#
# DEMO VALUES, like policies/canary-then-all.yaml: healthWait 30s, maxConcurrent 0 (unlimited) and no maintenance windows, so
# that a configuration change is visible within a minute in the Quickstarts. For production-like values (and the reasons for
# them) see gitops-template/config/policies/.
apiVersion: myriarch.dev/v1alpha1
kind: RolloutPolicy
metadata:
  name: config-canary
  description: Demo config rollout canary -> approval -> rest, health wait 30s, rollback on failure, no maintenance windows
spec:
  waves:
    - name: canary
      selector:
        matchAttributes:
          labels.wave: canary
    - name: rest
      percent: 100
      requireApproval: true
  maxConcurrent: 0
  # How long a target must stay online and healthy after its collector has applied the new configuration. The rollout page
  # shows the time that is left and names this policy as the source of the wait. 30s covers the restart of the collector and
  # the first export attempts with the configuration in a demo; real fleets use 2m or more (see gitops-template).
  healthWait: 30s
  applyTimeout: 10m
  failureThreshold:
    maxFailed: 1
  onFailure: rollback
