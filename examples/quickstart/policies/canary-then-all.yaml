# Version rollouts: first the wave "canary" (hosts with the inventory label wave=canary, see inventory/waves.yaml),
# then - after manual approval in the UI - all remaining hosts.
#
# DEMO VALUES. The two Quickstarts (Compose and kind) start from this policy, and a demo has to show a version update within
# about a minute after the last approval. That is why healthWait is 30s, maxConcurrent is 0 (every target of a wave at the same
# time) and there are no maintenance windows. gitops-template/config/policies/ has the production-like variant (longer
# healthWait, a limit on parallel targets and a commented window in local time) with the reasons for each value.
#
# onFailure: pause - the myriarch-updater rolls a host back to the previous version itself if the new one does not
# become healthy. Whether the rest of the fleet is updated anyway is decided by a human afterwards (resume,
# retry-failed, abort or rollback).
apiVersion: myriarch.dev/v1alpha1
kind: RolloutPolicy
metadata:
  name: canary-then-all
  description: Demo version rollout canary -> approval -> rest, health wait 30s, no limit on parallel targets, pause on failure
spec:
  waves:
    - name: canary
      selector:
        matchAttributes:
          labels.wave: canary
    - name: rest
      percent: 100
      requireApproval: true
  maxConcurrent: 0
  # How long a target must stay online and healthy after its collector has reported the new version. The rollout page shows
  # the time that is left and names this policy as the source of the wait. 30s is a demo value: the Quickstarts finish a
  # version rollout about a minute after the approval of the last wave. Real fleets want minutes (the production-like policy
  # uses 5m), so that a collector that crashes or turns unhealthy fails its target while the rollout is still in the canary wave.
  healthWait: 30s
  applyTimeout: 30m
  offlineGracePeriod: 30m
  failureThreshold:
    maxFailed: 1
  onFailure: pause
