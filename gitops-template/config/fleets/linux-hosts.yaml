# Linux hosts (physical and virtual servers, workstations), collector updates through the myriarch-updater.
#
# Assignment: Linux hosts with site.type datacenter or office. All three starter fleets use the same priority;
# their selectors are disjoint (os.type / site.type), so no agent is ambiguous. Give new fleets that can match the
# same agents a unique priority (the higher one wins).
#
# Version change: set collector.version through a merge request. Never roll out a config change and a version
# change in the same merge request.
apiVersion: myriarch.dev/v1alpha1
kind: Fleet
metadata:
  name: linux-hosts
  description: Linux hosts, updates through the myriarch-updater
spec:
  displayName: Linux hosts
  priority: 100
  selector:
    matchAttributes:
      os.type: linux
    matchExpressions:
      - key: site.type
        operator: In
        values: [datacenter, office]
  blueprint: linux-host
  parameters:
    gatewayEndpoint: gateway.example.com:4317
  collector:
    distribution: otelcol-contrib
    version: 0.161.0
  update:
    executor: updater
  rollout:
    configPolicy: canary-then-all
    versionPolicy: version-canary-then-all
