# Config rollouts: first the wave "canary" (hosts with the inventory label wave=canary, see inventory/waves.yaml),
# then - after manual approval in the UI - all remaining hosts.
# A broken config rolls back automatically (onFailure: rollback). A single failure triggers it.
#
# No maintenance windows, so changes become visible immediately. Production variant (local time zone of the site;
# the time zone comes from the attribute site.timezone, the default is rollouts.defaultTimezone of myriarchd):
#   maintenanceWindows:
#     - {days: [Mon, Tue, Wed, Thu, Fri, Sat], start: "21:30", end: "06:30"}
#     - {days: [Sun], start: "00:00", end: "00:00"}
# Note: with windows, targets stay in "waiting_window" during the day - tests then take until the evening.
apiVersion: myriarch.dev/v1alpha1
kind: RolloutPolicy
metadata:
  name: canary-then-all
  description: Config rollout canary -> approval -> rest, rollback on failure, no maintenance windows
spec:
  waves:
    - name: canary
      selector:
        matchAttributes:
          labels.wave: canary
    - name: rest
      percent: 100
      requireApproval: true
  # Production-like values. The Quickstarts (examples/quickstart) use healthWait 30s and maxConcurrent 0 so that a demo finishes
  # in about a minute; do not copy those into a real fleet.
  # maxConcurrent limits how many hosts change at the same time, so a bad change reaches 5 hosts at most before the first
  # failure is seen (0 would mean every host of the wave at once).
  maxConcurrent: 5
  # How long a target must stay online and healthy after it applied the change. 2m covers the restart of the collector and
  # the first export attempts; a collector that crashes, restarts in a loop or turns unhealthy within the wait fails its
  # target while the rollout is still in the canary wave. Every round of maxConcurrent waits this long, so the wait is also
  # the main part of the duration of a rollout.
  healthWait: 2m
  applyTimeout: 10m
  failureThreshold:
    maxFailed: 1
  onFailure: rollback
