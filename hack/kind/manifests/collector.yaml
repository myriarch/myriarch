# The real collector of the probe (namespace myriarch, Pod Security "restricted"): StatefulSet kind-gw in container mode.
# myriarch-updater is PID 1 and supervises the upstream OpAMP supervisor, which runs otelcol-contrib from the volume
# (contrib/legacy-kubernetes-collector/kustomize/README.md, docs/design/container-mode.md). The three config files are generated by the probe from
# the shipped templates (contrib/legacy-kubernetes-collector/supervisor, contrib/legacy-kubernetes-collector/updater) into the ConfigMap kind-gw-config; the
# Sigstore trusted root is the ConfigMap myriarch-trust; the enrollment token is the Secret the chart generated for the
# declared token "kind-gw".
apiVersion: v1
kind: Service
metadata:
  name: kind-gw
  namespace: myriarch
  labels:
    app.kubernetes.io/name: kind-gw
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: kind-gw
  ports:
    - {name: health, port: 13133, targetPort: health}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kind-gw
  namespace: myriarch
  labels:
    app.kubernetes.io/name: kind-gw
spec:
  serviceName: kind-gw
  replicas: 1
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: kind-gw
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kind-gw
    spec:
      # two stop timeouts plus the health timeouts of an update in flight (docs/design/container-mode.md)
      terminationGracePeriodSeconds: 150
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: "@@COLLECTOR_IMAGE@@"
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/myriarch-updater", "container", "--config=/etc/myriarch/updater.yaml"]
          env:
            - name: MYRIARCH_ENROLLMENT_TOKEN
              valueFrom:
                secretKeyRef: {name: myriarch-enrollment-kind-gw, key: token}
            - {name: MYRIARCH_OPAMP_ENDPOINT, value: "ws://myriarch:8080/v1/opamp"}
            - {name: SITE_TYPE, value: kind-gateway}
            - {name: SITE_ID, value: kind-gw}
            - {name: SITE_NAME, value: kind probe gateway}
            - {name: SITE_COUNTRY, value: ""}
            - {name: SITE_REGION, value: local}
            - {name: SITE_TIMEZONE, value: UTC}
            - {name: ENVIRONMENT, value: probe}
            - {name: K8S_CLUSTER_NAME, value: "kind-@@CLUSTER_NAME@@"}
            - name: K8S_NAMESPACE_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: K8S_POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: K8S_NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          ports:
            - {name: health, containerPort: 13133}
            - {name: updater, containerPort: 13135}
          startupProbe:
            httpGet: {path: /healthz, port: updater}
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /healthz, port: updater}
            periodSeconds: 15
            failureThreshold: 4
          readinessProbe:
            httpGet: {path: /, port: health}
            periodSeconds: 5
            failureThreshold: 6
          # four processes share the limit (updater, supervisor, collector and, during an update, a second collector
          # for the preflight validate)
          resources:
            requests: {cpu: 250m, memory: 768Mi, ephemeral-storage: 100Mi}
            limits: {memory: 1536Mi, ephemeral-storage: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /etc/opampsupervisor/supervisor.yaml, subPath: supervisor.yaml, readOnly: true}
            - {name: config, mountPath: /etc/myriarch/fallback.yaml, subPath: fallback.yaml, readOnly: true}
            - {name: config, mountPath: /etc/myriarch/updater.yaml, subPath: updater.yaml, readOnly: true}
            - {name: trust, mountPath: /etc/myriarch/trust, readOnly: true}
            - {name: binaries, mountPath: /var/lib/myriarch}
            - {name: storage, mountPath: /var/lib/otelcol/supervisor}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: kind-gw-config}
        - name: trust
          configMap: {name: myriarch-trust}
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
  volumeClaimTemplates:
    - metadata:
        name: binaries
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 3Gi}
    - metadata:
        name: storage
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 1Gi}
