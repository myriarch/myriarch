# kubectl apply -k contrib/legacy-kubernetes-collector/kustomize
# Secrets (secret.example.yaml) do NOT belong in this list - create them separately.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
resources:
  - namespace.yaml
  - supervisor-configmap.yaml
  - site-configmap.yaml
  - gateway.yaml
  - daemonset.yaml
  - networkpolicy.yaml
# Version change through the image tag (for example by the pipeline that the webhook executor triggers):
images:
  - name: registry.example.com/observability/otel-supervisor-collector
    newTag: 0.162.0
