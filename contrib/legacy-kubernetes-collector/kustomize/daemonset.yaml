# Node agent: one collector per node (for example for logs/host metrics). The supervisor storage lives on the
# node (hostPath) so that the instance UID and the queue survive pod restarts - every node is an
# OpAMP agent with its own stable identity. The config per workload "otel-agent" comes from myriarchd
# (site.type=k8s-node; create a fleet/blueprint of your own).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-agent
  namespace: observability
  labels:
    app.kubernetes.io/name: otel-agent
    app.kubernetes.io/part-of: myriarch
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-agent
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 10%
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-agent
        app.kubernetes.io/part-of: myriarch
    spec:
      # no Kubernetes API credential in a pod that runs configuration from Git; k8sattributes needs a dedicated
      # ServiceAccount with a read-only Role (see README.md)
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # hostPath ignores fsGroup: give the directory itself to the collector user (UID 10001) once. Not
        # recursive: a recursive change would follow hard links to files outside the directory.
        - name: fix-storage-permissions
          image: busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          command: ["sh", "-c", "chown 10001:10001 /storage && chmod 0750 /storage"]
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [CHOWN, FOWNER, DAC_OVERRIDE]
          volumeMounts:
            - {name: storage, mountPath: /storage}
      containers:
        - name: collector
          image: registry.example.com/observability/otel-supervisor-collector:0.162.0
          imagePullPolicy: IfNotPresent
          args: ["--config=/etc/opampsupervisor/supervisor.yaml"]
          envFrom:
            - configMapRef: {name: myriarch-site}
            - secretRef: {name: otel-collector-secrets}
          env:
            - name: MYRIARCH_ENROLLMENT_TOKEN
              valueFrom:
                secretKeyRef: {name: myriarch-enrollment, key: token}
            - {name: SITE_TYPE, value: k8s-node}
            - {name: SITE_ID, value: k8s-de-prod}
            - {name: SITE_NAME, value: Node agent}
            - name: K8S_POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: K8S_NAMESPACE_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: K8S_NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          ports:
            - {name: health, containerPort: 13133}
            - {name: sup-health, containerPort: 13134}
          livenessProbe:
            httpGet: {path: /health, port: sup-health}
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 4
          readinessProbe:
            httpGet: {path: /, port: health}
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: supervisor-config, mountPath: /etc/opampsupervisor/supervisor.yaml, subPath: supervisor.yaml, readOnly: true}
            - {name: supervisor-config, mountPath: /etc/myriarch/fallback.yaml, subPath: fallback.yaml, readOnly: true}
            - {name: storage, mountPath: /var/lib/otelcol/supervisor}
            - {name: tmp, mountPath: /tmp}
            # Example for a filelog receiver (pod logs): mount read-only and
            # mind the read permissions (group) of the node
            # - {name: varlogpods, mountPath: /var/log/pods, readOnly: true}
      tolerations:
        - operator: Exists
      volumes:
        - name: supervisor-config
          configMap: {name: otel-supervisor-config}
        - name: storage
          hostPath:
            path: /var/lib/myriarch/otel-agent
            type: DirectoryOrCreate
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
        # - name: varlogpods
        #   hostPath: {path: /var/log/pods}
