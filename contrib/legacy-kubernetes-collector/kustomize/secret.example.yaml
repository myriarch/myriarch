# EXAMPLE - do not commit real values! Create the Secret with external-secrets, sealed-secrets or
# kubectl:
#   kubectl -n observability create secret generic myriarch-enrollment \
#       --from-literal=token=myre_...
# One token per rollout channel/region (not per pod); labels can be attached on the token side.
apiVersion: v1
kind: Secret
metadata:
  name: myriarch-enrollment
  namespace: observability
type: Opaque
stringData:
  token: myre_REPLACE_ME
---
# Collector secrets that blueprints reference as ${env:NAME} (k8s-gateway: BACKEND_API_TOKEN)
apiVersion: v1
kind: Secret
metadata:
  name: otel-collector-secrets
  namespace: observability
type: Opaque
stringData:
  BACKEND_API_TOKEN: REPLACE_ME
