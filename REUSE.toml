# REUSE configuration (REUSE specification 3.3, https://reuse.software/spec-3.3/; checked by ci/reuse-lint.sh).
#
# Source files carry their SPDX header themselves (scripts/license-headers.py writes and checks it). This file covers
# every other file: data, configuration, documentation and artwork. License and copyright policy: docs/adr/0018.
# Apache-2.0 for code, CC-BY-4.0 for documentation and artwork. The copyright line is "Copyright The Myriarch Authors"
# without years and without personal names.
#
# Rules of this file:
#  - Every annotation uses precedence = "override", so the annotation decides, whatever a file says about itself. The one
#    exception is (n): precedence = "aggregate" adds the upstream copyright to the header of a derived file.
#  - When several annotations match a file, the LAST one wins. The general patterns therefore come first and the
#    specific ones after them.
#  - Attribution of third-party material is given in the comments above the annotation.
#  - Texts under LICENSE* and this file are ignored by reuse itself; the license texts are in LICENSES/.

version = 1

# a) Configuration, data and project metadata of the project itself: Apache-2.0.
[[annotations]]
path = [
  "**/*.yaml",
  "**/*.yml",
  "**/*.json",
  "**/*.sha256",
  "**/go.mod",
  "**/go.sum",
  "**/.gitignore",
  "**/*.dockerignore",
  "**/.helmignore",
  "**/.prettierignore",
  ".editorconfig",
  ".node-version",
  ".github/CODEOWNERS",
  "**/*.env",
  "**/requirements*.txt",
  "**/requirements.in",
  "**/build-requirements.in",
  "scripts/check-language.exclude",
  "hack/kind/git/sshd_config",
  "ci/license-overrides.txt",
  "ci/vulncheck-allowlist.txt",
  "ci/workflow-permissions.txt",
  "ci/workflow-secrets.txt",
  "ci/tests/testdata/workflows/**",
]
precedence = "override"
SPDX-FileCopyrightText = "Copyright The Myriarch Authors"
SPDX-License-Identifier = "Apache-2.0"

# b) Test data observed by the project itself (component aliases verified with otelcol-contrib validate, and other
# fixtures written for the tests). There is no upstream text in these files.
[[annotations]]
path = [
  "internal/blueprint/testdata/**",
  "internal/testdata/**",
]
precedence = "override"
SPDX-FileCopyrightText = "Copyright The Myriarch Authors"
SPDX-License-Identifier = "Apache-2.0"

# c) Documentation: every Markdown file (docs/, decision records, website text, the root documents such as README and
# CHANGELOG, the READMEs next to the code and the pull request template) is CC-BY-4.0. Code snippets inside the
# documentation are Apache-2.0 (ADR-0018). Exceptions below: the GitOps template (c2), GOVERNANCE.md and
# CONTRIBUTOR_LADDER.md (f).
[[annotations]]
path = "**/*.md"
precedence = "override"
SPDX-FileCopyrightText = "Copyright The Myriarch Authors"
SPDX-License-Identifier = "CC-BY-4.0"

# c2) The GitOps template is content that users copy into their own repository: all of it, its README included, is
# Apache-2.0, so that the template carries a single license. The component lists below it keep annotation (k), which
# comes later.
[[annotations]]
path = "gitops-template/**"
precedence = "override"
SPDX-FileCopyrightText = "Copyright The Myriarch Authors"
SPDX-License-Identifier = "Apache-2.0"

# d) Brand artwork: CC-BY-4.0 (assets/brand/README.md). The files under web/public are byte-identical copies of the
# assets/brand artwork (favicon.svg, favicon.ico, apple-touch-icon.png). The wordmark outlines come from Inter 4.1
# (SIL OFL-1.1, https://github.com/rsms/inter), which allows this use; no font file is distributed in the repository or
# in the UI bundle. The artwork is generated by assets/brand/source, which is Apache-2.0 and carries its own headers.
[[annotations]]
path = [
  "assets/brand/*.svg",
  "assets/brand/*.png",
  "assets/brand/*.ico",
  "web/public/**",
]
precedence = "override"
SPDX-FileCopyrightText = "Copyright The Myriarch Authors"
SPDX-License-Identifier = "CC-BY-4.0"

# e) Generated compilation of third-party notices: the file is generated by scripts/gen-third-party-notices.sh. The
# compilation as such is Apache-2.0; every reproduced license text and notice keeps the terms of its own component.
[[annotations]]
path = [
  "THIRD_PARTY_NOTICES",
  "scripts/notices/third-party-texts.json",
]
precedence = "override"
SPDX-FileCopyrightText = "Copyright The Myriarch Authors"
SPDX-License-Identifier = "Apache-2.0"

# f) Governance documents adapted from the CNCF project template (https://github.com/cncf/project-template, main at
# e66ba44f724d00f66c84932593c5a229fee3564b; GOVERNANCE-maintainer.md last changed in
# f584e4b9a7313b1985a3d91673c1863495f5ebe0, CONTRIBUTOR_LADDER.md in 296c10ee1c933b1a3585143f909378a3153b7206).
# The template is licensed under Apache-2.0 (its LICENSE names no copyright holder). The documents were changed by The
# Myriarch Authors and say so in their text (Apache-2.0 section 4(b)); the adapted documents stay under the upstream
# license instead of CC-BY-4.0.
[[annotations]]
path = [
  "GOVERNANCE.md",
  "CONTRIBUTOR_LADDER.md",
]
precedence = "override"
SPDX-FileCopyrightText = "Copyright The Myriarch Authors"
SPDX-License-Identifier = "Apache-2.0"

# g) Code of conduct adapted from the CNCF Community Code of Conduct v1.3
# (https://github.com/cncf/foundation/blob/f2bb3ab459ee44ef5cddc34f285018b7d37837ea/code-of-conduct.md, the last change of
# that file). cncf/foundation has no LICENSE file; its license-notices.md states that CNCF documentation is CC-BY-4.0
# under section 11 of the CNCF charter. The CNCF text is itself adapted from the Contributor Covenant 2.0
# (https://github.com/EthicalSource/contributor_covenant, tag 2.0, commit 1575a9e3134cdba80988afc153528ba7ba7c1257),
# whose LICENSE.md is CC-BY-4.0. The copyright holder of the CNCF text is not stated upstream, so only the line of the
# project is given here; the attribution is in the Acknowledgements section of the document.
[[annotations]]
path = "CODE_OF_CONDUCT.md"
precedence = "override"
SPDX-FileCopyrightText = "Copyright The Myriarch Authors"
SPDX-License-Identifier = "CC-BY-4.0"

# h) Recorded upstream data used as test fixtures, with the holder "The OpenTelemetry Authors" (the convention of the
# upstream source headers, for example otelcol/collector.go at v0.162.0), Apache-2.0 (the LICENSE files of the
# repositories):
#  - raw/open-telemetry/opentelemetry-collector/v0.162.0/CHANGELOG.md: the first 18431 bytes of CHANGELOG.md at tag
#    v0.162.0 of https://github.com/open-telemetry/opentelemetry-collector (tag object
#    7340d4812100c04aa7b8b32c28c3f61ddbc95e74), truncated, otherwise unchanged.
#  - raw/open-telemetry/opentelemetry-collector-contrib/v0.162.0/CHANGELOG.md: the first 176815 bytes of CHANGELOG.md at
#    tag v0.162.0 of https://github.com/open-telemetry/opentelemetry-collector-contrib (tag object
#    0cea0d4f24220e2e54bf89b6ace0416cf6fdd593), truncated, otherwise unchanged.
#  - github/repos/open-telemetry/opentelemetry-collector-releases/releases.json: a recording of the GitHub REST call
#    GET /repos/open-telemetry/opentelemetry-collector-releases/releases (9 releases, up to v0.162.0, tag object
#    45939e7d1878272f17b52dd40728663de7ef7eae), reduced to 12 fields per release; no user objects are included.
[[annotations]]
path = "internal/release/testdata/fixtures/**"
precedence = "override"
SPDX-FileCopyrightText = "Copyright The OpenTelemetry Authors"
SPDX-License-Identifier = "Apache-2.0"

# i) Release signatures and digests of https://github.com/open-telemetry/opentelemetry-collector-releases
# (Apache-2.0, holder The OpenTelemetry Authors), byte-identical to the release assets of cmd/opampsupervisor/v0.162.0
# (opampsupervisor_0.162.0_linux_amd64.sha256 and .sigstore.json) and of v0.162.0
# (otelcol-contrib_0.162.0_linux_amd64.tar.gz.sha256, .sha256.sigstore.json and .sigstore.json).
[[annotations]]
path = [
  "internal/artifact/testdata/sigstore/opampsupervisor_*",
  "internal/artifact/testdata/sigstore/otelcol-contrib_*",
  "internal/updater/testdata/sigstore/opampsupervisor_*",
  "internal/updater/testdata/sigstore/otelcol-contrib_*",
]
precedence = "override"
SPDX-FileCopyrightText = "Copyright The OpenTelemetry Authors"
SPDX-License-Identifier = "Apache-2.0"

# j) Sigstore trusted root: the JSON content equals targets/trusted_root.json of
# https://github.com/sigstore/root-signing at commit c9bda74ad2221f938f7d2e0295ca3aad2da710a8 (Apache-2.0). The file was
# fetched through TUF and serialized again, so the bytes differ from the repository file. The holder follows the source
# header convention of the Sigstore projects (for example sigstore-go); the LICENSE of root-signing names no holder.
[[annotations]]
path = [
  "internal/artifact/testdata/sigstore/trusted_root.json",
  "internal/updater/testdata/sigstore/trusted_root.json",
]
precedence = "override"
SPDX-FileCopyrightText = "Copyright The Sigstore Authors"
SPDX-License-Identifier = "Apache-2.0"

# k) Component lists: the output of `otelcol-contrib components` for 0.162.0. All 242 modules are listed in
# distributions/otelcol-contrib/manifest.yaml at tag v0.162.0 of
# https://github.com/open-telemetry/opentelemetry-collector-releases (Apache-2.0). The data is derived from
# OpenTelemetry; the JSON layout and the note are by The Myriarch Authors, so both holders are named.
[[annotations]]
path = [
  "examples/sim/components-otelcol-contrib-*.json",
  "gitops-template/ci/components-otelcol-contrib-*.json",
]
precedence = "override"
SPDX-FileCopyrightText = [
  "Copyright The OpenTelemetry Authors",
  "Copyright The Myriarch Authors",
]
SPDX-License-Identifier = "Apache-2.0"

# l) The website (website/, ADR-0031). Markdown pages fall under (c). Templates and scripts carry their header. These files cannot
# carry one: the markdownlint and lychee configuration, the pinned digests of the Docsy overrides, the web app manifest and the
# fixtures of the website checks (code and configuration: Apache-2.0).
[[annotations]]
path = [
  "website/.markdownlint-cli2.jsonc",
  "website/lychee.toml",
  "website/overrides.txt",
  "website/scripts/request-pages.txt",
  "**/*.webmanifest",
  "website/scripts/testdata/**",
]
precedence = "override"
SPDX-FileCopyrightText = "Copyright The Myriarch Authors"
SPDX-License-Identifier = "Apache-2.0"

# m) Artwork and screenshots of the website: CC-BY-4.0, like the brand artwork. The brand files themselves are mounted from
# assets/brand (annotation d), not copied.
[[annotations]]
path = [
  "website/assets/images/**",
  "website/static/images/**",
]
precedence = "override"
SPDX-FileCopyrightText = "Copyright The Myriarch Authors"
SPDX-License-Identifier = "CC-BY-4.0"

# n) Overrides of Docsy files (ADR-0031): these files of website/layouts are modified copies of Docsy v0.18.0 files (Apache-2.0;
# website/overrides.txt pins the upstream digests). They keep the header of the project and, through precedence = "aggregate", the
# upstream copyright is added to it, so that the derivation is machine-readable. No file of Docsy is copied without a change.
[[annotations]]
path = [
  "website/layouts/404.html",
  "website/layouts/_partials/favicons.html",
  "website/layouts/_partials/head.html",
  "website/layouts/_partials/page-meta-links.html",
  "website/layouts/_partials/footer/copyright.html",
  "website/layouts/_partials/scripts/plugins/mermaid.html",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "Copyright The Docsy Authors"
SPDX-License-Identifier = "Apache-2.0"
