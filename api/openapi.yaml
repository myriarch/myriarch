  /rollouts/{id}/targets:
    get:
      operationId: listRolloutTargets
      tags: [rollouts]
      summary: Targets (agents) of a rollout
      description: Without `sort`, targets are ordered by wave, hostname and agent ID.
      x-permission: read
      parameters:
        - $ref: '#/components/parameters/UUIDPath'
        - { name: wave, in: query, schema: { type: integer, minimum: 0 } }
        - name: status
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: '#/components/schemas/TargetStatus' }
        - name: agent
          in: query
          description: >-
            Only the target of this agent (at most one item). The UI uses it to keep an open detail view current
            while the target moves between pages of the `activity` order.
          schema: { type: string, format: uuid }
        - name: sort
          in: query
          description: >-
            `wave` (default) orders by wave, hostname and agent ID. This order does not change while target statuses
            change, so use it to page through all targets. `activity` ranks by status first (in_progress and verifying,
            waiting_window, failed and rolled_back, pending, succeeded, skipped, cancelled), then by wave, hostname and
            agent ID. Statuses change while a rollout runs, so a target can move between pages between two requests.
          schema: { type: string, enum: [wave, activity], default: wave }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Targets
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RolloutTargetPage' }
        '404':
          $ref: '#/components/responses/NotFound'
