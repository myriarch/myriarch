openapi: 3.1.0
info:
  title: Myriarch REST API
  version: 0.1.0
  summary: Management API of myriarchd (OpAMP based OpenTelemetry Collector fleet management)
  description: |
    REST API used by the myriarch web UI, myrctl and automation.

    **Conventions**
    - Base path `/api/v1`. JSON (UTF-8) request and response bodies; field names are camelCase.
    - Timestamps are RFC 3339 in UTC. Durations are Go duration strings (`"30s"`, `"5m"`).
    - Hashes are lower-case hex strings (SHA-256 unless stated otherwise).
    - Collector versions are given WITHOUT a leading `v` (`"0.162.0"`), except package offers.
    - Maps and arrays marked as required are never `null` (empty `{}` / `[]`).
    - Errors use RFC 9457 problem details (`application/problem+json`, schema `Problem`) with a
      stable machine readable `code`.
    - Paginated lists: `limit` (1..500, default 50) and `offset` (0..100000) query parameters; response
      `{items, total, limit, offset}`. Unpaginated lists: `{items}`.
    - Sorting: `sort=<field>` ascending, `sort=-<field>` descending.

    **Authentication**
    - Browser: server-side session cookie `myriarch_session` (OIDC login or dev login); with Secure
      cookies (the production setting) the cookie is named `__Host-myriarch_session`. Mutating
      requests (POST/PUT/PATCH/DELETE) authenticated by the cookie MUST send the header
      `X-CSRF-Token` with the value of the `myriarch_csrf` cookie (also returned by `GET /auth/me`).
    - Automation: `Authorization: Bearer myra_...` (API token with a fixed role, never higher than the
      role of its creator; it stops working when the creator is disabled and after the maximum token
      lifetime `auth.apiTokenMaxTtl`, default 90 days). No CSRF header needed.
    - Request bodies must be `application/json` (other content types: 415). Sessions have an idle
      timeout and an absolute maximum age. Repeated failed logins or invalid bearer tokens are rate
      limited per client address (429 with `Retry-After`).
    - Roles: `viewer` (read), `operator` (viewer + operational actions), `admin` (operator + users,
      API tokens, enrollment tokens). Each operation lists its permission in `x-permission`.

    **Live updates**: `GET /events/stream` (Server-Sent Events), see operation `streamEvents`.

    **Non-REST endpoints** (not part of this document): OpAMP `/v1/opamp` (WebSocket + HTTP,
    agents authenticate with `Authorization: Bearer myre_...` enrollment tokens), `/healthz`
    (liveness), `/readyz` (readiness), `/metrics` (Prometheus, by default on the separate
    metrics listener), `/licenses` (`LICENSE` and `THIRD_PARTY_NOTICES` as `text/plain`, no login).
  contact:
    name: The Myriarch Authors
    url: https://myriarch.dev
  license:
    name: Apache License 2.0
    identifier: Apache-2.0
servers:
  - url: /api/v1
    description: same origin as the UI
security:
  - sessionCookie: []
  - bearerToken: []
tags:
  - name: auth
    description: Login, logout, current principal
  - name: users
    description: Users and roles
  - name: tokens
    description: API tokens and agent enrollment tokens
  - name: agents
    description: OpAMP agents (collectors and myriarch-updaters)
  - name: savedFilters
    description: Saved agent list filters
  - name: stats
    description: Dashboard aggregates
  - name: system
    description: System information and effective settings
  - name: audit
    description: Audit log
  - name: live
    description: Server-Sent Events for live UI updates
  - name: fleets
    description: Fleets from GitOps (read-only), fleet matching, UI version selection within the Git frame
  - name: blueprints
    description: Blueprints from GitOps (read-only), rendering preview
  - name: rolloutPolicies
    description: Rollout policies from GitOps (read-only)
  - name: executors
    description: Update executor definitions from GitOps (read-only)
  - name: rollouts
    description: Config and version rollouts, operator actions
  - name: releases
    description: Upstream collector releases, breaking changes
  - name: gitops
    description: GitOps sync status, history, manual sync, webhook
  - name: artifacts
    description: Artifact cache for collector binaries
  - name: notifications
    description: Notification channels
  - name: install
    description: Installation of hosts from the server - plan, install grants, installer bundles and rendered commands (available from v0.2.0)

paths:
  # ===================================================================== auth
  /auth/config:
    get:
      operationId: getAuthConfig
      tags: [auth]
      summary: Login options (public)
      security: []
      x-permission: public
      responses:
        '200':
          description: Login options
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthConfigInfo' }
  /auth/login:
    get:
      operationId: startOidcLogin
      tags: [auth]
      summary: Start the OIDC authorization code flow (PKCE) - browser redirect
      security: []
      x-permission: public
      parameters:
        - name: redirect
          in: query
          description: UI path to return to after login (must start with "/").
          schema: { type: string, default: / }
      responses:
        '302':
          description: Redirect to the identity provider
        '404':
          $ref: '#/components/responses/NotFound'
  /auth/callback:
    get:
      operationId: oidcCallback
      tags: [auth]
      summary: OIDC redirect URI - creates the session and redirects to the UI
      security: []
      x-permission: public
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        '302':
          description: |
            Redirect to the UI (session and CSRF cookies set). On failure the redirect goes to
            `/login?error=access_denied` (no role mapped for the user) or `/login?error=oidc_error`.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/dev-login:
    post:
      operationId: devLogin
      tags: [auth]
      summary: Local login (only when auth.devLogin.enabled, i.e. dev mode)
      security: []
      x-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DevLoginRequest' }
      responses:
        '200':
          description: Logged in; session and CSRF cookies set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          description: Too many login attempts for this client address or user name (code too_many_requests, header Retry-After)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /auth/bootstrap-login:
    post:
      operationId: bootstrapLogin
      tags: [auth]
      summary: Break-glass sign-in of the bootstrap admin (only while auth.bootstrapAdmin is active)
      security: []
      x-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BootstrapLoginRequest' }
      responses:
        '200':
          description: Signed in; session and CSRF cookies set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          description: Too many sign-in attempts for this client address or for the bootstrap admin (code too_many_requests, header Retry-After)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the session
      x-permission: read
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '204':
          description: Logged out
  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Current principal with effective permissions
      x-permission: read
      responses:
        '200':
          description: Current principal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==================================================================== users
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users
      x-permission: users:manage
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserList' }
        '403':
          $ref: '#/components/responses/Forbidden'
  /users/{id}:
    patch:
      operationId: updateUser
      tags: [users]
      summary: Change role (sets roleSource=manual) or disable a user
      x-permission: users:manage
      parameters:
        - $ref: '#/components/parameters/UUIDPath'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  # =================================================================== tokens
  /tokens:
    get:
      operationId: listApiTokens
      tags: [tokens]
      summary: List API tokens (without secrets)
      x-permission: tokens:manage
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: API tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/APITokenList' }
    post:
      operationId: createApiToken
      tags: [tokens]
      summary: Create an API token (the secret is returned only once)
      x-permission: tokens:manage
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAPITokenRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedAPIToken' }
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /tokens/{id}:
    delete:
      operationId: revokeApiToken
      tags: [tokens]
      summary: Revoke an API token
      x-permission: tokens:manage
      parameters:
        - $ref: '#/components/parameters/UUIDPath'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Revoked
        '404':
          $ref: '#/components/responses/NotFound'
  /enrollment-tokens:
    get:
      operationId: listEnrollmentTokens
      tags: [tokens]
      summary: List agent enrollment tokens (without secrets)
      x-permission: enrollment:manage
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Enrollment tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrollmentTokenList' }
    post:
      operationId: createEnrollmentToken
      tags: [tokens]
      summary: Create an enrollment token for supervisors/myriarch-updaters (secret returned once)
      x-permission: enrollment:manage
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEnrollmentTokenRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedEnrollmentToken' }
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /enrollment-tokens/{id}:
    delete:
      operationId: revokeEnrollmentToken
      tags: [tokens]
      summary: Revoke an enrollment token (connected agents are not disconnected; reconnects fail)
      x-permission: enrollment:manage
      parameters:
        - $ref: '#/components/parameters/UUIDPath'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Revoked
        '404':
          $ref: '#/components/responses/NotFound'

  # =================================================================== agents
  /agents:
    get:
      operationId: listAgents
      tags: [agents]
      summary: List agents (server-side filtering, sorting, pagination)
      x-permission: read
      parameters:
        - $ref: '#/components/parameters/AgentQ'
        - $ref: '#/components/parameters/AgentKindFilter'
        - $ref: '#/components/parameters/AgentStatusFilter'
        - $ref: '#/components/parameters/AgentHealthyFilter'
        - $ref: '#/components/parameters/AgentFleetFilter'
        - $ref: '#/components/parameters/AgentUnassignedFilter'
        - $ref: '#/components/parameters/AgentVersionFilter'
        - $ref: '#/components/parameters/AgentOutdatedFilter'
        - $ref: '#/components/parameters/AgentOSFilter'
        - $ref: '#/components/parameters/AgentAttrFilter'
        - $ref: '#/components/parameters/AgentConfigSyncFilter'
        - name: sort
          in: query
          description: Sort field, prefix "-" for descending.
          schema:
            type: string
            enum: [hostname, -hostname, version, -version, status, -status, fleet, -fleet, lastSeenAt, -lastSeenAt,
                   firstSeenAt, -firstSeenAt, health, -health, configSync, -configSync, osType, -osType, siteId, -siteId]
            default: hostname
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Page of agents
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentSummaryPage' }
        '400':
          $ref: '#/components/responses/BadRequest'
  /agents/facets:
    get:
      operationId: getAgentFacets
      tags: [agents]
      summary: Value counts for filter UIs (same filters as listAgents)
      description: >
        Counts are disjunctive: the counts of a facet ignore the filter of that
        facet's own dimension (so selecting one fleet still lists the other
        fleets with their counts and a multi-select is possible) and apply all
        other filters. `total` counts the agents matching all filters.
      x-permission: read
      parameters:
        - $ref: '#/components/parameters/AgentQ'
        - $ref: '#/components/parameters/AgentKindFilter'
        - $ref: '#/components/parameters/AgentStatusFilter'
        - $ref: '#/components/parameters/AgentHealthyFilter'
        - $ref: '#/components/parameters/AgentFleetFilter'
        - $ref: '#/components/parameters/AgentUnassignedFilter'
        - $ref: '#/components/parameters/AgentVersionFilter'
        - $ref: '#/components/parameters/AgentOutdatedFilter'
        - $ref: '#/components/parameters/AgentOSFilter'
        - $ref: '#/components/parameters/AgentAttrFilter'
        - $ref: '#/components/parameters/AgentConfigSyncFilter'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Facets
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentFacets' }
  /agents/{id}:
    parameters:
      - $ref: '#/components/parameters/AgentIDPath'
    get:
      operationId: getAgent
      tags: [agents]
      summary: Agent details
      x-permission: read
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '200':
          description: Agent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentDetail' }
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteAgent
      tags: [agents]
      summary: Forget an agent (only allowed while offline; 412 otherwise)
      x-permission: agents:delete
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /agents/{id}/effective-config:
    get:
      operationId: getAgentEffectiveConfig
      tags: [agents]
      summary: Effective config reported by the agent (expanded, includes defaults, secrets redacted by the collector)
      x-permission: read
      parameters:
        - $ref: '#/components/parameters/AgentIDPath'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '200':
          description: Effective config
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigDocument' }
        '404':
          $ref: '#/components/responses/NotFound'
  /agents/{id}/desired-config:
    get:
      operationId: getAgentDesiredConfig
      tags: [agents]
      summary: Rendered config currently offered (desired) or assigned by GitOps
      x-permission: read
      parameters:
        - $ref: '#/components/parameters/AgentIDPath'
        - name: which
          in: query
          schema: { type: string, enum: [desired, assigned], default: desired }
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '200':
          description: Rendered config
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigDocument' }
        '404':
          $ref: '#/components/responses/NotFound'
  /agents/{id}/components:
    get:
      operationId: getAgentComponents
      tags: [agents]
      summary: Available components reported by the agent
      x-permission: read
      parameters:
        - $ref: '#/components/parameters/AgentIDPath'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '200':
          description: Component set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComponentSet' }
        '404':
          $ref: '#/components/responses/NotFound'
  /agents/{id}/events:
    get:
      operationId: listAgentEvents
      tags: [agents]
      summary: Event history of the agent (newest first, cursor pagination)
      x-permission: read
      parameters:
        - $ref: '#/components/parameters/AgentIDPath'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: before
          in: query
          description: Return events with id < before (0 = newest).
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '200':
          description: Events
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentEventList' }
        '404':
          $ref: '#/components/responses/NotFound'
  /agents/{id}/actions/restart:
    post:
      operationId: restartAgent
      tags: [agents]
      summary: Send an OpAMP restart command (agent must have AcceptsRestartCommand)
      x-permission: agents:operate
      parameters:
        - $ref: '#/components/parameters/AgentIDPath'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '202':
          description: Command queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionAccepted' }
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /agents/{id}/actions/resync:
    post:
      operationId: resyncAgent
      tags: [agents]
      summary: Force resync - clear failed config hash, re-send desired config, request full state
      x-permission: agents:operate
      parameters:
        - $ref: '#/components/parameters/AgentIDPath'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '202':
          description: Command queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionAccepted' }
        '404':
          $ref: '#/components/responses/NotFound'

  /agents/{id}/actions/reenroll:
    post:
      operationId: reenrollAgent
      tags: [agents]
      summary: Clear the credential binding of an agent (the instance uid is bound to the enrollment token / client certificate of its first registration; the next connection with a valid credential claims it)
      x-permission: enrollment:manage
      parameters:
        - $ref: '#/components/parameters/AgentIDPath'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '202':
          description: Binding cleared
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionAccepted' }
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================= savedFilters
  /saved-filters:
    get:
      operationId: listSavedFilters
      tags: [savedFilters]
      summary: Own and shared saved filters
      x-permission: read
      parameters:
        - name: page
          in: query
          schema: { type: string, default: agents }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Saved filters
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedFilterList' }
    post:
      operationId: createSavedFilter
      tags: [savedFilters]
      summary: Save a filter
      x-permission: saved_filters:write
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSavedFilterRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedFilter' }
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /saved-filters/{id}:
    delete:
      operationId: deleteSavedFilter
      tags: [savedFilters]
      summary: Delete an own saved filter
      x-permission: saved_filters:write
      parameters:
        - $ref: '#/components/parameters/UUIDPath'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'

  # ==================================================================== stats
  /stats/overview:
    get:
      operationId: getOverviewStats
      tags: [stats]
      summary: Dashboard aggregates
      x-permission: read
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Overview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OverviewStats' }

  # =================================================================== system
  /system/info:
    get:
      operationId: getSystemInfo
      tags: [system]
      summary: Version, replicas, leader, database, features and effective non-secret settings
      x-permission: read
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: System info
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemInfo' }

  # ==================================================================== audit
  /audit:
    get:
      operationId: listAuditEvents
      tags: [audit]
      summary: Audit log (newest first)
      x-permission: audit:read
      parameters:
        - { name: actor, in: query, description: Actor id or display name (exact match; the name case-insensitively), schema: { type: string } }
        - { name: action, in: query, description: 'Exact action or prefix with "*" (e.g. "rollout.*")', schema: { type: string } }
        - { name: targetType, in: query, schema: { type: string } }
        - { name: targetId, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '200':
          description: Audit events
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEventPage' }
        '403':
          $ref: '#/components/responses/Forbidden'

  # ===================================================================== live
  /events/stream:
    get:
      operationId: streamEvents
      tags: [live]
      summary: Live updates as Server-Sent Events
      description: |
        `text/event-stream`. Each message has `event: <type>`, `id: <monotonic id>` and
        `data: <JSON>`:

        | event | data schema |
        |---|---|
        | `agent.updated` | `AgentSummary` (coalesced, max 1/s per agent) |
        | `agent.removed` | `LiveAgentRemovedData` |
        | `rollout.updated` | `RolloutSummary` |
        | `fleet.updated` | `LiveFleetUpdatedData` - the effective target version or the UI version selection of a fleet changed (select, clear, superseded/invalidated by Git): refetch fleet views |
        | `gitops.synced` | `GitOpsBrief` |
        | `release.new` | `ReleaseSummary` |
        | `stats.changed` | `{}` - hint to refetch the dashboard (max 1 per 5 s) |
        | `resync` | `{}` - client fell behind or the server lost events: refetch all views |

        A comment line `: ping` is sent every 15 s. Clients use `EventSource` (cookie auth) and
        reconnect automatically; after a reconnect they should refetch visible data
        (no replay; `Last-Event-ID` is ignored).
      x-permission: read
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema: { type: string }

  # =================================================================== fleets
  /fleets:
    get:
      operationId: listFleets
      tags: [fleets]
      summary: All fleets with live status
      x-permission: read
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Fleets
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FleetSummaryList' }
  /fleets/match:
    post:
      operationId: matchFleets
      tags: [fleets]
      summary: Explain which fleet an (existing or hypothetical) agent belongs to
      x-permission: read
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MatchFleetsRequest' }
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Match result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchFleetsResponse' }
  /fleets/{name}:
    get:
      operationId: getFleet
      tags: [fleets]
      summary: Fleet details
      x-permission: read
      parameters:
        - $ref: '#/components/parameters/NamePath'
      responses:
        '200':
          description: Fleet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FleetDetail' }
        '404':
          $ref: '#/components/responses/NotFound'
  /fleets/{name}/version-options:
    get:
      operationId: getFleetVersionOptions
      tags: [fleets]
      summary: Versions an operator may select for the fleet (frame from Git, dialog data)
      description: |
        Returns the effective target, the frame from Git (`spec.update.selection`) and every candidate version with
        the information the update dialog shows. Candidates are the known non-prerelease releases of the fleet's
        distribution that satisfy the frame, the versions listed in `spec.update.selection.versions`, the Git
        target (`spec.collector.version`) and the version of an existing UI selection; newest first. A candidate
        that cannot be selected carries `selectable=false` and a `reasonCode`. Works for every fleet: without a
        frame `allowed` is false (`notAllowedCode=selection_disabled`) and `options` lists only the Git target.
      x-permission: read
      parameters:
        - $ref: '#/components/parameters/NamePath'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Version options
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FleetVersionOptions' }
        '404':
          $ref: '#/components/responses/NotFound'
  /fleets/{name}/actions/select-version:
    post:
      operationId: selectFleetVersion
      tags: [fleets]
      summary: Set the target collector version of the fleet within the Git frame and start the version rollout
      description: |
        Stores a UI version selection for the fleet (who, when, why; audited as `fleet.version.select`, also when
        refused) and asks the leader to plan the fleet. The version rollout is created by the planner on the leader
        with the policy `spec.update.selection.rolloutPolicy` (default `spec.rollout.versionPolicy`), `origin=ui`,
        `createdBy` = the operator and `requestReason` = `reason`; an active version rollout to another version is
        superseded. If `version` already is the effective target, nothing is stored (200, `planned=false`, message).

        The handler waits up to 10 s for the leader to plan the fleet. `planned=true`: the planner has run for this
        selection; `rolloutId` is the version rollout that brings the fleet to the selected version (absent if no
        member collector needs an update). `planned=false`: not planned within the wait time (leader busy or
        changing); the rollout follows, the UI waits for `fleet.updated` / `rollout.updated`.

        Preconditions (412 `precondition_failed`): `spec.update.selection.enabled` is true, the fleet has an update
        executor (not `none`), and the fleet has no version rollout in status `failed` or `rolling_back` (abort it
        first). Validation (422 `validation_failed`, `issues[].code`): `version_not_allowed` (outside the frame),
        `downgrade_not_allowed` (lower than the current effective target and `allowDowngrade` is false),
        `unknown_version` (not a known release of the distribution and not listed in `selection.versions`),
        `prerelease_not_allowed`, `reason_required` (`selection.requireReason` and no reason). 409 `conflict`:
        `expectedTargetVersion` does not match the current effective target (someone else changed it).
      x-permission: fleets:set_version
      parameters:
        - $ref: '#/components/parameters/NamePath'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SelectFleetVersionRequest' }
      responses:
        '200':
          description: Selection stored (and usually planned)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SelectFleetVersionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /fleets/{name}/actions/clear-version-selection:
    post:
      operationId: clearFleetVersionSelection
      tags: [fleets]
      summary: Remove the UI version selection; the Git target (spec.collector.version) applies again
      description: |
        Deletes the UI selection (active or invalidated) of the fleet; audited as `fleet.version.clear`. The effective
        target becomes `spec.collector.version` (or none). The planner then supersedes a version rollout to the
        previously selected version and, if the Git target differs from the members' versions, creates a new rollout
        (this can be a downgrade: the UI warns before). Allowed even when `spec.update.selection.enabled` is false.
        Without a selection the call changes nothing and returns the current target (200). With
        `spec.update.selection.requireReason` a reason is mandatory (422 `validation_failed`, issue `reason_required`).
      x-permission: fleets:set_version
      parameters:
        - $ref: '#/components/parameters/NamePath'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClearFleetVersionSelectionRequest' }
      responses:
        '200':
          description: Effective target after clearing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FleetVersionTarget' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

