# The <title> of pages whose own title (the H1 and the label in the navigation) says too little in a list of search results.
# Key: the URL path of the page. Value: the title without the site title, which the template appends (" | myriarch"). Keep it to
# 49 characters, so that the whole title stays within 60, and spell the name as ADR-0015 says ("Myriarch" starts a title).
# Pair OpAMP with OpenTelemetry or Collector in a title: in search results the bare word also stands for operational amplifiers.
# Do not use the abbreviation otel; the project avoids it (ADR-0016).
# Myriarch appears only as the first word of a title; elsewhere the name is lower case (ADR-0015).
# website/layouts/_partials/seo/title.html explains the order of the rules; check-seo.py fails on a title that two pages share.
