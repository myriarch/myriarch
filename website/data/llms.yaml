# The content of /llms.txt, the summary of the site for language models and AI assistants (https://llmstxt.org/). layouts/home.llms.txt
# renders it with the title of the site as the heading. The text is curated here, not generated from the pages.
#
#   summary     the one-paragraph summary (the blockquote under the heading)
#   details     paragraphs of background: what it does, who it is for, status, independence
#   terms       key terms with a definition (term, text)
#   sections    groups of links (title, links); a section titled "Optional" holds what a reader may skip
#                 page   the path of a page of the site (/docs/concepts/gitops/); the build fails when it does not exist. The title of the
#                        link is the title of the page unless `title` is set
#                 url    a link that leaves the site: only the GitHub repository of the project (params.repo.url) is allowed
#                 note   one sentence about the target (required)
#
# scripts/check-seo.py checks the built file: links only to pages of the site and to the repository, no placeholder page, no duplicate
# link, and one spelling of the name. Spelling (ADR-0015): "myriarch" in identifiers and in the middle of a sentence, "Myriarch" at the
# start of a sentence. Write only what the documentation backs; the support levels and the release status change, so name neither.
summary: "Myriarch is an open-source fleet manager for OpenTelemetry Collectors, built on OpAMP. Git is the source of truth for blueprints, fleets, rollout policies and the allowed collector versions; the web UI and the REST API operate within that frame, and every operator action is audited."

details:
  - "What it does: collectors keep running under the upstream OpAMP Supervisor. The server myriarchd renders one configuration per collector from layered blueprints, offers it over OpAMP, rolls changes out in waves with approvals, health gates and rollback, and starts collector version updates through exchangeable executors, because the Supervisor cannot replace the collector binary."
  - "Who it is for: operators who run many OpenTelemetry Collectors on Linux and Windows hosts, in containers and on Kubernetes, at edge sites, in data centers and in the cloud. It is designed for around 1,000 collectors, with headroom up to 5,000."
  - "Status and license: the project is alpha, so interfaces, configuration and the GitOps format (myriarch.dev/v1alpha1) can still change. The code is licensed under Apache-2.0 and the documentation under CC BY 4.0."
  - "Independence: myriarch is an independent project. OpenTelemetry, Kubernetes and CNCF are trademarks of The Linux Foundation, and myriarch is not affiliated with or endorsed by The Linux Foundation or the OpenTelemetry project. The names are used only to describe compatibility."

terms:
  - term: OpAMP
    text: "The Open Agent Management Protocol of the OpenTelemetry project, a network protocol with which a server manages a fleet of telemetry agents: status reporting, remote configuration and package offers."
  - term: OpAMP Supervisor
    text: "The upstream process that starts and monitors a collector and speaks OpAMP for it. It manages configuration, health and restarts, but it cannot replace the collector binary."
  - term: GitOps frame
    text: "What a Git repository declares: blueprints, fleets, rollout policies and the allowed collector versions. The web UI chooses inside this frame, for example a target version from the allowed range, and never edits the declared state."
  - term: Blueprint
    text: "A layered, parameterized collector configuration. The server renders it into one content-addressed configuration per agent."
  - term: Fleet
    text: "A group of agents selected by their attributes. It decides which blueprint, which parameter values and which collector version the agents get, and which rollout policies apply."
  - term: Rollout
    text: "A controlled change of the configuration or the collector version of a fleet: in waves, with approvals, health gates, failure thresholds, pause, abort and rollback."
  - term: Executor
    text: "The way a collector version update is started: the host agent myriarch-updater, a webhook, an AWX job, or by hand. The server learns the result from the version that the collector itself reports."
  - term: Programs
    text: "myriarchd is the server (OpAMP endpoint, REST API, web UI, GitOps syncer and rollout engine). myrctl validates and renders a GitOps repository. myriarch-updater is the host agent for collector binary updates. myriarch-sim is the load simulator."

