# Release status of the project, the single source for the status chip of the landing page (layouts/_partials/landing/hero.html).
# Set it by hand after a release is published (docs/releasing.md, "After every publication"); the release workflow never writes it.
# Plain Markdown (README, docs/, SECURITY.md) does not read this file, so those texts describe the process, not the current state.
#
#   final:      tag of the latest final release (vX.Y.Z), or "" while there is none
#   candidate:  tag of the newest release candidate (vX.Y.Z-rc.N) while no final release exists, or ""
#
# Only one of the two is set. Both empty: "No release has been published yet". scripts/check-landing.py checks the format and the chip.
final: "v0.1.0"
candidate: ""
