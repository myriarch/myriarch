# Site parameters (Docsy 0.18). Privacy rules (ADR-0031): no analytics, no search service, no comments, no CDN features.
copyright: The Myriarch Authors
description: Fleet manager for OpenTelemetry Collectors, built on OpAMP. Git is the source of truth; every operator action is audited.
images: [images/og-image.png]

repo:
  url: https://github.com/myriarch/myriarch
  branch: main

# Metadata for search engines and AI crawlers (layouts/_partials/seo/, layouts/home.llms.txt and data/llms.yaml; website/README.md, "SEO and
# GEO"). scripts/check-seo.py reads this block and compares it with the built pages, so the values and the pages cannot drift apart.
seo:
  # The origin of every canonical link and of the URLs in the structured data and in llms.txt. It is fixed on purpose: a preview is built
  # with WEBSITE_BASEURL=/ and would name itself as the original otherwise. It must equal baseURL in hugo.yaml (check-seo.py).
  canonicalBase: https://myriarch.dev/
  # The title of the home page. Every other page is titled "<page title> | <site title>". Spelling (ADR-0015): "Myriarch" starts a title.
  homeTitle: "Myriarch: GitOps fleet manager for OpenTelemetry Collectors"
  # The facts of the structured data of the home page (schema.org SoftwareSourceCode). The name is the site title, the description is
  # params.description, the repository is params.repo.url and the version is the latest release of data/release.yaml.
  license: https://www.apache.org/licenses/LICENSE-2.0
  programmingLanguage: [Go, TypeScript]
  keywords: [OpenTelemetry Collector, OpAMP, fleet management, GitOps, rollouts]

# Search runs in the browser (lunr, self-hosted); the index is a file of the site.
offlineSearch: true
offlineSearchSummaryLength: 140
offlineSearchMaxResults: 20

# Linked from the footer (Font Awesome solid icons only: no brand logos, ADR-0016).
links:
  developer:
    - name: Repository
      url: https://github.com/myriarch/myriarch
      icon: fa-solid fa-code-branch
    - name: Releases
      url: https://github.com/myriarch/myriarch/releases
      icon: fa-solid fa-tag
    - name: Issues
      url: https://github.com/myriarch/myriarch/issues
      icon: fa-solid fa-bug
  user:
    - name: Security policy
      url: /project/security/
      icon: fa-solid fa-shield-halved
    - name: Contributing
      url: /project/contributing/
      icon: fa-solid fa-hand-holding-heart

docsy:
  plugins:
    # Mermaid is used by docs/architecture.md and docs/design/version-selection.md. The script is the self-hosted copy from
    # node_modules (layouts/_partials/scripts/plugins/mermaid.html); the version equals the one in package.json. Mermaid 12 made the
    # ELK layout, the redux-color theme and the neo look the defaults; the options keep the layout, the theme and the look of
    # Mermaid 11 (the ELK layout shrinks the overview in docs/architecture.md to an unreadable size at the width of the content
    # column).
    # The version stays first in the line: check-notices.py reads it with a pattern.
    mermaid: { enable: true, version: 12.1.0, options: '{"layout": "dagre", "look": "classic", "theme": "default"}' }
    markmap: { enable: false }
    click-to-copy: { enable: true }
    tabpane-persist: { enable: true }

ui:
  # Follows prefers-color-scheme; the menu stores the choice in the browser (localStorage), see /legal/privacy/.
  showLightDarkModeMenu: true
  # The logo is the CSS background of .navbar-brand__logo (assets/scss/_styles_project.scss), so the light and dark variants switch.
  navbar_logo: false
  sidebar_search_disable: true
  sidebar_menu_compact: true
  sidebar_menu_foldable: true
  breadcrumb_disable: false
  taxonomy_breadcrumb_disable: true
  footer_about_enable: false
  # No feedback widget (it would report to an analytics service).
  feedback:
    enable: false
  readingtime:
    enable: false
  navbar_translucent_over_cover_disable: false

# The following services of the theme stay disabled on purpose; each one loads scripts from a third party.
prism_syntax_highlighting: false
