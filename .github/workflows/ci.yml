# Continuous integration (ADR-0032). The jobs run the gates of ci/check-local.sh (one source of commands, local and in CI),
# plus what only a runner can prove: the platform matrix of the Go tests, the release rehearsal, the commit range scan, the
# dependency review (ADR-0038) and the end-to-end test. "ci-ok" is the only required check of the branch ruleset.
#
# Policy (enforced by ci/check-workflows.py): only GitHub-owned actions pinned to a commit SHA, a read-only token, no
# pull_request_target or workflow_run, no persisted checkout credentials, a timeout on every job, no secrets (only the deployment
# jobs that ci/workflow-secrets.txt lists may read one; this workflow has none).
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  schedule:
    # nightly: new advisories (vulncheck), upstream schemas and downloads, cold caches
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Pull requests share one group per pull request (a newer push cancels the older run). Every other event gets its own
  # group, because GitHub keeps only one pending run per group and would drop queued runs of main commits otherwise.
  group: ci-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.event_name == 'push' && github.sha || github.event_name) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  GOTOOLCHAIN: local
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  CI: 'true'

jobs:
  # ---- Go: build, vet for the other platforms, lint, release dependencies, licenses of the release ---------------------
  go:
    name: go
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the toolchain
        uses: ./.github/actions/setup
      - name: Run the gates (go)
        env:
          ONLY: go
        run: ci/check-local.sh
      - name: Upload the gate logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-local-go
          path: .cache/check-local/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

  # ---- Go tests on Linux (amd64 and arm64) with a PostgreSQL service and -race ------------------------------------------
  go-test-linux:
    name: go-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    services:
      postgres:
        # the digest of deploy/compose/docker-compose.yaml (a multi-architecture index; ci/check.sh keeps both in step)
        image: postgres:17@sha256:ae69c452f483507a6b99fb654cf93aad7fe156ffd2c56247707eef4e36d3c12b
        env:
          # throw-away database of this job, reachable on 127.0.0.1 only: not a secret
          POSTGRES_PASSWORD: ci-${{ github.run_id }}
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --shm-size 256m
    env:
      PGTEST_DSN: postgres://postgres:ci-${{ github.run_id }}@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the toolchain
        uses: ./.github/actions/setup
      - name: Raise max_connections of the PostgreSQL service
        env:
          PG_ID: ${{ job.services.postgres.id }}
        run: |
          docker exec "${PG_ID}" psql -U postgres -c 'ALTER SYSTEM SET max_connections = 300'
          docker restart "${PG_ID}"
          for _ in $(seq 1 60); do
            if docker exec "${PG_ID}" pg_isready -U postgres -q; then break; fi
            sleep 1
          done
          test "$(docker exec "${PG_ID}" psql -U postgres -tAc 'SHOW max_connections')" = 300
      - name: Run the Go tests (-race, external PostgreSQL)
        env:
          ONLY: go-test
        run: ci/check-local.sh
      - name: Upload the gate logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-local-go-test-${{ matrix.os }}
          path: .cache/check-local/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

  # ---- Go tests on macOS (embedded PostgreSQL, -race) and Windows (no -race, no database tests) -----------------------------
  go-test-native:
    name: go-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            race: '1'
            devpg: '1'
            pgskip: ''
            perf: '1'
            timeout: 60
          - os: windows-latest
            race: '0'
            devpg: '0'
            pgskip: '1'
            # the render budget (5000 agents in under 5 s) is an acceptance criterion of the server, which does not ship for
            # Windows; the main run still renders the fleet there, only the timing run is left out
            perf: '0'
            timeout: 45
    env:
      GO_TEST_RACE: ${{ matrix.race }}
      GO_TEST_DEVPG: ${{ matrix.devpg }}
      GO_TEST_PERF: ${{ matrix.perf }}
      PGTEST_SKIP: ${{ matrix.pgskip }}
    steps:
      - name: Keep the line endings of the repository (Windows)
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global core.longpaths true
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the toolchain
        uses: ./.github/actions/setup
      - name: Cache the embedded PostgreSQL binaries (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/myriarch/embedded-postgres
          key: pgtest-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}
      - name: Run the Go tests
        env:
          ONLY: go-test
        run: ci/check-local.sh
      # The retry code of install-windows.ps1 has to run on Windows PowerShell 5.1 (the script declares #Requires -Version 5.1) and on
      # PowerShell 7; the test uses the python of the runner image for its local fault server.
      - name: Test the download retries under Windows PowerShell 5.1 and PowerShell 7 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = (Get-Location).Path
          $failed = $false
          foreach ($exe in 'powershell.exe', 'pwsh') {
            & $exe -NoProfile -NonInteractive -File ci/tests/download-retry.ps1 `
              -Installer "$root\deploy\scripts\install-windows.ps1" -SmokeWindows "$root\ci\release\smoke-windows.ps1" `
              -Server "$root\ci\tests\http-fault-server.py" -Work "$env:RUNNER_TEMP\download-retry-$([IO.Path]::GetFileNameWithoutExtension($exe))"
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }
      - name: Upload the gate logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-local-go-test-${{ matrix.os }}
          path: .cache/check-local/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

  # ---- database matrix: the database tests on an embedded PostgreSQL with TLS and with a collation other than C -------------------
  # go-test-linux runs the whole suite against the plain PostgreSQL service (C collation, no TLS). This job repeats the
  # database-facing packages in the two environments the service container can not offer (internal/testutil/pgtest, PGTEST_TLS and
  # PGTEST_COLLATION). The upgrade tests from an empty database and from the schema of v0.1.0 run in every job above.
  db-matrix:
    name: db-matrix (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tls
            tls: '1'
            collation: ''
          - name: collation
            tls: ''
            collation: en_US.UTF-8
    env:
      PGTEST_TLS: ${{ matrix.tls }}
      PGTEST_COLLATION: ${{ matrix.collation }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the toolchain
        uses: ./.github/actions/setup
      - name: Cache the embedded PostgreSQL binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/myriarch/embedded-postgres
          key: pgtest-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}
      - name: Run the database tests (-race, embedded PostgreSQL)
        run: |
          ulimit -n 10240
          go test -race -count=1 ./internal/store/... ./internal/leader/... ./internal/eventbus/... ./internal/pgsession/... ./internal/testutil/...

  # ---- web UI: schema drift, typecheck, lint, formatting, tests, build ------------------------------------------------------
  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the toolchain
        uses: ./.github/actions/setup
        with:
          node: 'true'
      - name: Run the gates (web)
        env:
          ONLY: web
        run: ci/check-local.sh
      - name: Upload the gate logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-local-web
          path: .cache/check-local/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

  # ---- binaries, examples and the release rehearsal (a throwaway test CA signs, nothing is published) ----------------------------
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the toolchain
        uses: ./.github/actions/setup
        with:
          node: 'true'
          # osslsigncode is built from source: the headers are no-ops on the runner image, the call keeps the job independent of it
          tools: goreleaser syft go-winres yq apt:libssl-dev apt:zlib1g-dev osslsigncode
      - name: Build the UI that the binaries embed
        run: make web-build
      - name: Run the gates (build, examples)
        env:
          ONLY: build,examples
        run: ci/check-local.sh
      - name: Rehearse the release build (collect, test-CA signing pass, apply, dist and reproducibility checks)
        run: make release-rehearsal
      - name: Upload the gate logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-local-build
          path: |
            .cache/check-local/
            dist/*.txt
            dist/*.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

  # ---- shell scripts and the Helm chart ------------------------------------------------------------------------------------------
  shell-helm:
    name: shell-helm
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the toolchain
        uses: ./.github/actions/setup
        with:
          tools: shellcheck helm kubeconform yq
      - name: Run the gates (shellcheck,helm)
        env:
          ONLY: shellcheck,helm
        run: ci/check-local.sh
      - name: Upload the gate logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-local-shell-helm
          path: .cache/check-local/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

  # ---- documentation and the language guard ----------------------------------------------------------------------------------------
  docs:
    name: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the toolchain
        uses: ./.github/actions/setup
      - name: Run the gates (language,docs)
        env:
          ONLY: language,docs
        run: ci/check-local.sh
      - name: Upload the gate logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-local-docs
          path: .cache/check-local/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

  # ---- website: build and checks only, never a deployment -------------------------------------------------------------------------
  website:
    name: website
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # the dates of the sitemap are commit dates (website/config/_default/hugo.yaml, enableGitInfo)
      - name: Set up the toolchain
        uses: ./.github/actions/setup
        with:
          node: 'true'
      - name: Run the gates (website)
        env:
          ONLY: website
        run: ci/check-local.sh
      - name: Upload the gate logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-local-website
          path: .cache/check-local/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

  # ---- licenses, known vulnerabilities, secrets (tree and, on pull requests, the commit range) ---------------------------
  compliance:
    name: compliance
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - name: Set up the toolchain
        uses: ./.github/actions/setup
        with:
          node: 'true'
      - name: Run the gates (licenses,vulncheck,secrets)
        env:
          ONLY: licenses,vulncheck,secrets
        run: ci/check-local.sh
      - name: Scan the commits of the pull request for secrets
        if: github.event_name == 'pull_request'
        env:
          SECRETS_SCAN_RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: ci/secrets-scan.sh
      - name: Upload the gate logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-local-compliance
          path: .cache/check-local/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

  # ---- dependency review: the licenses and known vulnerabilities of the dependencies that a pull request adds or updates -------------------
  # The action compares the dependency graph of the base with that of the head of a pull request or of a merge group (ADR-0038;
  # .github/dependency-review-config.yml, ci/license-allowlist.txt). Any other event (a push to main, the nightly run, a manual run) has
  # nothing to compare, and a skipped job would fail ci-ok, so the job succeeds there with a note. The token is the read-only token of the
  # run: no comment is written to the pull request, the result is in the log and in the job summary. The action asks no third party:
  # the OpenSSF Scorecard summary of its dependencies is off.
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review the dependency changes
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          config-file: ./.github/dependency-review-config.yml
          fail-on-severity: high
          fail-on-scopes: runtime
          comment-summary-in-pr: never
          show-openssf-scorecard: false
      - name: Nothing to review
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        run: echo "The dependency review compares a pull request or a merge group with its base; there is nothing to compare for the event ${GITHUB_EVENT_NAME}."

  # ---- the workflows themselves: actionlint, zizmor and the policy check ----------------------------------------------------------------
  workflows:
    name: workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the toolchain
        uses: ./.github/actions/setup
      # Online mode of zizmor: the audits that ask the GitHub API about the pinned actions (impostor commits, known vulnerable
      # versions, stale references). The token is the read-only token of the run.
      - name: Run the gates (workflows)
        env:
          ONLY: workflows
          ZIZMOR_ONLINE: '1'
          GH_TOKEN: ${{ github.token }}
        run: ci/check-local.sh
      - name: Upload the gate logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-local-workflows
          path: .cache/check-local/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

  # ---- tests of the scripts under ci/ and contrib/ ---------------------------------------------------------------------------------------
  scripts:
    name: scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the toolchain
        uses: ./.github/actions/setup
        with:
          tools: cosign helm crane pwsh gitleaks shellcheck zizmor syft yq goreleaser apt:libssl-dev apt:zlib1g-dev osslsigncode
      - name: Run the script tests
        run: make ci-test

  # ---- end-to-end test with the real supervisor and the UI smoke test ----------------------------------------------------------------------
  e2e:
    name: e2e
    uses: ./.github/workflows/e2e.yml
    with:
      mode: smoke

  # ---- the only required check: every job above must have succeeded ------------------------------------------------------------------------
  ci-ok:
    name: ci-ok
    if: always()
    needs: [go, go-test-linux, go-test-native, db-matrix, web, build, shell-helm, docs, website, compliance, dependency-review, workflows, scripts, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"${NEEDS}"
          jq -e 'to_entries | all(.value.result == "success")' <<<"${NEEDS}" >/dev/null
