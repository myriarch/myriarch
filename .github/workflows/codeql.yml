# CodeQL code scanning (ADR-0032; docs/security/model.md, "Static analysis in CI"). One matrix job per language:
#
#   go                      manual build: `go build ./...` and `go build -tags devpg ./...`, so that the code behind the build tag
#                           devpg (the server with an embedded development PostgreSQL) is analysed too
#   javascript-typescript   the web UI (web/) and the scripts of the website (website/); no build needed
#   actions                 the workflows and local actions below .github
#
# Default setup of code scanning stays off in the repository settings, because this workflow replaces it. The results go to the
# code scanning alerts of the repository (Security tab); nothing here blocks a merge, a ruleset may require them later.
#
# Policy (enforced by ci/check-workflows.py): only github/codeql-action from the pinned set, a SHA pin, a read-only token at the
# top, no persisted checkout credentials, a timeout. The one write scope (security-events, to upload the results) is listed in
# ci/workflow-permissions.txt. The three steps of github/codeql-action must stay on the same commit as upload-sarif in
# scorecard.yml (rule R2).
name: codeql

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # weekly: new queries and a new CodeQL version find alerts in code that did not change
    - cron: '29 5 * * 2'

permissions:
  contents: read

# A newer push to a pull request replaces the running analysis; runs on main are never cancelled.
concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    # A pull request from a fork or from Dependabot gets a read-only token that cannot upload results to code scanning, so the job
    # would only fail there. The analysis of the merged code runs on the push to main.
    if: >-
      github.event_name != 'pull_request'
      || (github.event.pull_request.head.repo.full_name == github.repository
          && github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      # upload the results to code scanning (reviewed in ci/workflow-permissions.txt)
      security-events: write
      # read the repository, and read the workflow runs of the repository to attach the analysis to them
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Go toolchain comes from go.mod (GOTOOLCHAIN=local keeps the build from downloading another one).
      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      # Manual build: CodeQL traces both builds. The second one compiles the files behind the build tag devpg (the same two
      # commands as the gate "go" of ci/check-local.sh).
      - name: Build the Go packages
        if: matrix.language == 'go'
        env:
          GOTOOLCHAIN: local
        run: |
          go build ./...
          go build -tags devpg ./...

      - name: Perform the CodeQL analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
