exporters:
  otlp_grpc/gateway:
    endpoint: otel-gw-1.example.internal:4317
    headers:
      authorization: Bearer ${env:OTEL_GATEWAY_TOKEN}
    retry_on_failure:
      enabled: true
      max_elapsed_time: 0s
    sending_queue:
      enabled: true
      storage: file_storage/queue
    tls:
      insecure: false
extensions:
  file_storage/queue:
    create_directory: true
    directory: /var/lib/otelcol/storage
  health_check:
    endpoint: localhost:13133
processors:
  batch:
    send_batch_size: 2048
    timeout: 5s
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 15
  resource/site:
    attributes:
      - action: upsert
        key: site.id
        value: DC-NORTH
      - action: upsert
        key: site.type
        value: datacenter
      - action: upsert
        key: site.country
        value: NL
      - action: upsert
        key: deployment.environment.name
        value: prod
  resource_detection:
    detectors:
      - env
      - system
    system:
      hostname_sources:
        - os
receivers:
  file_log/app:
    include:
      - /opt/app/logs/*.log
    multiline:
      line_start_pattern: ^\d{4}-\d{2}-\d{2}
    start_at: end
    storage: file_storage/queue
  host_metrics:
    collection_interval: 30s
    scrapers:
      cpu: {}
      disk: {}
      filesystem: {}
      load: {}
      memory: {}
      network: {}
  otlp:
    protocols:
      grpc:
        endpoint: localhost:4317
      http:
        endpoint: localhost:4318
  prometheus/app:
    config:
      scrape_configs:
        - job_name: app
          scrape_interval: 30s
          static_configs:
            - targets:
                - localhost:9464
service:
  extensions:
    - health_check
    - file_storage/queue
  pipelines:
    logs:
      exporters:
        - otlp_grpc/gateway
      processors:
        - memory_limiter
        - resource_detection
        - resource/site
        - batch
      receivers:
        - otlp
        - file_log/app
    metrics:
      exporters:
        - otlp_grpc/gateway
      processors:
        - memory_limiter
        - resource_detection
        - resource/site
        - batch
      receivers:
        - otlp
        - host_metrics
        - prometheus/app
    traces:
      exporters:
        - otlp_grpc/gateway
      processors:
        - memory_limiter
        - resource_detection
        - resource/site
        - batch
      receivers:
        - otlp
  telemetry:
    logs:
      level: info
