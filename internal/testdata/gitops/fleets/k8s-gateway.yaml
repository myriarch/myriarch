apiVersion: myriarch.dev/v1alpha1
kind: Fleet
metadata:
  name: k8s-gateway
  description: Regional OTLP gateways in Kubernetes; version changes through the image tag pipeline
spec:
  displayName: Gateways (Kubernetes)
  priority: 200
  selector:
    matchAttributes:
      site.type: k8s-gateway
  blueprint: k8s-gateway
  parameters:
    backendEndpoint: https://otlp.observability.example.com
  collector:
    version: 0.162.0
  update:
    executor: webhook
    executorRef: k8s-image-bump
    params:
      deployment: otel-gateway
  rollout:
    configPolicy: gateway
    versionPolicy: gateway
