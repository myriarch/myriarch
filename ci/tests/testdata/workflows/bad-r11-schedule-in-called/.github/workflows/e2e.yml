name: e2e
on:
  workflow_call:
    inputs:
      mode:
        type: string
        default: smoke
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-smoke
          path: .e2e/results.txt
  load:
    if: github.event_name == 'schedule' || inputs.mode == 'load'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - run: echo load
