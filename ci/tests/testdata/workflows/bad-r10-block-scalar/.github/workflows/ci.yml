name: ci
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Gates
        env:
          ONLY: go,web
        run: ci/check-local.sh
  e2e:
    uses: ./.github/workflows/e2e.yml
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
      - name: Deploy
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          OTHER_TOKEN: |
            ${{ secrets.DEPLOY_TOKEN }}
        run: ./deploy.sh
