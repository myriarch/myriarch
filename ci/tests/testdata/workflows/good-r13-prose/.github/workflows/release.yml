name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check the tag
        env:
          TAG: ${{ github.ref_name }}
        run: ci/release/guard.sh "${TAG}"
  build:
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Build
        run: |
          corepack enable
          pnpm --dir web install --frozen-lockfile
          make build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
  sign:
    needs: [guard, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
      - name: Sign the checksums (no go, no make, no pnpm in this job)
        shell: bash
        continue-on-error: false
        run: |
          # The build tools are not available in this job: no go, no make, no pnpm.
          echo "go and make run in the build job"
          cosign sign-blob --yes --bundle checksums.txt.sigstore.json checksums.txt
          # go build, make and pnpm install run in the build job, not here.
          echo "run make now? no: go build is not allowed in this job"
          printf '%s\n' 'npm ci' "node script.js" > notes.txt
          cat > build-notes.txt <<'EOF'
          make build
          go test ./...
          EOF
          command -v go || echo "no go in this job"
          if [ -n "${TAG}" ]; then echo "make is a word"; fi
          gh release view "${TAG}" --json assets | jq '.assets[] | select(.name == "go")'
          cosign verify-blob --certificate-identity-regexp '^https://github.com/make/go' checksums.txt
          git log --grep make --oneline | head -n 1
          ./scripts/make-release-notes.sh
          x=$((1 + 2)); echo "${x} go"
          tools=(go node)
          declare -a more=(
            make   # a comment
            pnpm
          )
          echo "tools: ${tools[*]} ${more[*]}"
          case "${TAG}" in
            go) echo "the word go as a case pattern" ;;
            make|node)
              echo "make or node as case patterns"
              ;;
            (npm) echo npm ;;&
            *) echo "other" ;;
          esac
          case "${TAG}" in v0.*) echo "an early release" ;; *) echo "later" ;; esac
          bash ./ci/release/verify.sh "${TAG}"
          bash -c 'echo go build is only text here'
          time -p sha256sum checksums.txt
          find . -name '*.go' -exec sha256sum {} +
          env -S "printf %s go" > /dev/null
  verify:
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
      - name: Verify
        run: sha256sum --check checksums.txt
  finalize:
    needs: [guard, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "${TAG}" --draft=false
