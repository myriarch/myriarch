name: release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
      - name: Publish
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: ./publish.sh
