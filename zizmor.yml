# Configuration of zizmor, the static analyser of the GitHub Actions workflows (ci/lint-workflows.sh; docs/development.md,
# "Continuous integration"; docs/security/model.md). zizmor runs with the regular persona. This file holds the ignored findings
# and nothing else: no audit is switched off, and every entry below says why the finding does not apply. A finding that is not
# listed here fails the workflows gate. Narrow entries: a rule, a file (and a line where the finding is about one place).
#
# Single places are ignored in the file itself with a trailing comment `# zizmor: ignore[<rule>]` (see the github-env entries in
# .github/actions/setup/action.yml, each with its reason).
rules:
  # `uses: ./...` should be `uses: $/...`. GitHub supports the second form since July 2026 (it cannot load an action that an
  # earlier step cloned at run time), but actionlint (v1.7.12, ci/versions.env) rejects it as an invalid action reference, so the
  # workflows gate would fail, and ci/check-workflows.py (R1, R8, R13) reads the local form. Move to `$/` when actionlint accepts
  # it and rule R1 is extended, and drop these entries then. The audit only ever reports this one construct, so the entries cover
  # nothing else in the two files; every other workflow uses no local action or workflow.
  self-repository:
    ignore:
      - ci.yml
      - e2e.yml
